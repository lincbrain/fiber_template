# The plan reproduce/build_everything.py runs: every step of docs/build_everything.md, as one entry each.
# Every step reads the paper's inputs from the data folders (links to the records) and writes into the clone; its check compares
# what it wrote with the paper's file. Fields:
#   name      the step's id; with `for`, the step is written out once per brain as <name>-<ID>, and {id} in the other fields is the brain
#   group     setup | paper | mri-template | blockface | registration | synthesis | blockface-template | link | histology | labels | training
#   for       a set of brains (`sets` below) or a list of LINC IDs
#   title, inputs, outputs   what it does, reads and writes, in plain words
#   run       the command: one shell line, from the repository root, in the shell that `source envs/linc_envs.sh` (or env/lab.sh) gives
#   check     a command that exits 0 only when `expect` holds and prints its evidence on its last line; left out when there is no
#             file of record to compare with
#   expect    what the check proves
#   needs     steps that must have run to their end first; a per-brain step's base name means the same brain's step
#   gpu_gb, gpu_model, gpu_alone, ram_gb, cores, disk_gb   what it needs: free GPU memory (GB), the card model when the check only
#             holds on it, the card to itself, RAM (GB), cores, the disk it writes (GB)
#   hours, timed   how long it took, and where that time comes from: clone | docs | paper's run | estimated
#   optional  true: runs only when named with --only
#   note      one sentence a tester must know

sets:
  mri_template: [MF283, MF284, MF285, MF286]
  all: [MF278, MF275, MF282, MF191, MF196, MF204, MR243, MR252, MR256, MR249, MR250, MR251, MR253, MR254, MR257, MR261, MR244, MR247, MR248, MR263, MR273]
  with_mri: [MF278, MF275, MF282, MR243, MR252, MR256, MR249, MR250, MR251, MR253, MR254, MR257, MR261]
  without_mri: [MF191, MF196, MF204, MR244, MR247, MR248, MR263, MR273]
  large: [MF278, MF275, MF282, MR252, MR256, MR250, MR251, MR253, MR254, MR257, MR261, MR263, MR273]
  small: [MF191, MF196, MF204, MR243, MR249, MR244, MR247, MR248]
  histology: [MR243, MR252, MR256, MF278, MF275, MF191]
  labels: [MR243, MR252, MR256, MF191]

steps:

  # ---- setup
  - name: data-folders
    group: setup
    title: Data folders of all 21 brains (records linked, hand inputs copied)
    inputs: the records ($LINC_RECORDS/data/sub-<ID>, read only); configs/subjects/<ID>.yaml
    outputs: $LINC_DATA/sub-<ID>/ (links to the records; xfm/ empty, xfm_record/ the entries of record); $LINC_REBUILD_DATA/sub-<ID>/blockface/ (copies
      of the hand inputs only)
    run: tools/make_local_data.sh $(dirname $LINC_DATA) MF278 MF275 MF282 MF191 MF196 MF204 MR243 MR252 MR256 MR249 MR250 MR251 MR253 MR254 MR257
      MR261 MR244 MR247 MR248 MR263 MR273 && tools/make_local_data.sh $(dirname $LINC_REBUILD_DATA) --rebuild MF278 --rebuild MF275 --rebuild MF282
      --rebuild MF191 --rebuild MF196 --rebuild MF204 --rebuild MR243 --rebuild MR252 --rebuild MR256 --rebuild MR249 --rebuild MR250 --rebuild MR251
      --rebuild MR253 --rebuild MR254 --rebuild MR257 --rebuild MR261 --rebuild MR244 --rebuild MR247 --rebuild MR248 --rebuild MR263 --rebuild MR273
    check: 'n=0; for S in MF278 MF275 MF282 MF191 MF196 MF204 MR243 MR252 MR256 MR249 MR250 MR251 MR253 MR254 MR257 MR261 MR244 MR247 MR248 MR263
      MR273; do E=$LINC_REBUILD_DATA/sub-$S/blockface/curated/$S; [ -e $LINC_DATA/sub-$S/blockface/$S"_blockface.ome.zarr" ] && [ -f $E"_mask_edited.nii.gz"
      ] && [ -f $E"_holes_edited.nii.gz" ] && [ ! -L $E"_mask_edited.nii.gz" ] && n=$((n+1)); done; l=$(find $LINC_REBUILD_DATA/sub-*/blockface -type
      l | wc -l); echo "$n of 21 brains: products of record linked, hand inputs copied; $l links in the rebuild''s blockface folders"; [ $n -eq 21
      ] && [ $l -eq 0 ]'
    expect: all 21 brains in both folders, and no link into the records in the rebuild's blockface folders (so a reconstruction cannot write into
      the records)
    needs: []
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 1
    cores: 1
    disk_gb: 2
    hours: 0.15
    timed: clone
    optional: false
    note: 'Tested: 7 min 6 s, 132,901 links and 15,571 copies (1.0 GB), check 21 of 21. Adds to the folders env/lab.sh built and overwrites
      nothing, so it is safe to rerun; but not beside another tools/make_local_data.sh writing to the same folder (two runs can race on one link):
      run other lanes'' data-folder steps after it.'

  # ---- paper
  - name: paper-numbers
    group: paper
    title: Compute every numbers record of the paper (CPU)
    inputs: the paper's products (records, read only), the raw MRI and histology links of local_data/raw
    outputs: $LINC_NUMBERS/<record>.json (about 70 records), $LINC_WORK (about 10 GB of intermediate files)
    run: LINC_DATA=$LINC_PRODUCTS/data make numbers
    check: $PY reproduce/check_numbers.py --ref reproduce/reference --new $LINC_NUMBERS $($PY -c "import os, pathlib; print(' '.join(sorted(p.stem
      for p in pathlib.Path(os.environ['LINC_NUMBERS']).glob('*.json') if p.name != 'provenance.json')))")
    expect: every record written so far matches the paper's reference (documented exceptions on their paper-read fields)
    needs: []
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 32
    cores: 4
    disk_gb: 11
    hours: 2.3
    timed: clone
    optional: false
    note: 2 h 16 min serial at nice 10 on a shared machine (4 Nov clone, run 5-6 Nov); RAM not measured (32 GB is an estimate)
  - name: paper-numbers-gpu
    group: paper
    title: Compute the two numbers records that run a network on the GPU
    inputs: the leave-slab-out network and the prepared brains of record; the development and final stand-in b0s
    outputs: $LINC_NUMBERS/d3_domain_shift.json, d3_domain_shift_prod.json
    run: LINC_DATA=$LINC_PRODUCTS/data make numbers-gpu
    check: $PY reproduce/check_numbers.py --ref reproduce/reference --new $LINC_NUMBERS d3_domain_shift d3_domain_shift_prod
    expect: both records match the paper's on the fields the comparison reads, to 1e-4 (GPU predictions; identical on an RTX 6000 Ada)
    needs: []
    gpu_gb: 4
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 4
    disk_gb: 0.01
    hours: 0.06
    timed: clone
    optional: false
    note: about 3 min for both; within the 1e-4 tolerance on any card, identical on the RTX 6000 Ada
  - name: paper-numbers-figures
    group: paper
    title: Draw the figures that also write a numbers record
    inputs: the paper's products (records, read only); the 3D environment (install.sh --with-figures-3d)
    outputs: outputs/figures/ (tracer, tracer_pathways, alignment_comparison, tracer_3d, tracer_sections3d) and their records in $LINC_NUMBERS
    run: LINC_DATA=$LINC_PRODUCTS/data make numbers-figures
    check: $PY reproduce/check_numbers.py --ref reproduce/reference --new $LINC_NUMBERS fig_tracer_r058 fig_tracer_pathways fig_tracer_pathways_panels
      fig_routes_1c_section fig_tracer_3d fig_tracer_3d_stills fig_tracer_sections3d_v2
    expect: the 7 figure records match the paper's
    needs: []
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 4
    disk_gb: 1
    hours: 0.2
    timed: clone
    optional: false
    note: needs PY_VIZ3D (env/install.sh --with-figures-3d); tracer_sections3d also renders its video
  - name: paper-figures
    group: paper
    title: Draw the paper's figures
    inputs: the paper's products (records, read only); HISTOLOGY_ARGS and LINC_RAW (env/lab.sh)
    outputs: outputs/figures/<target>.{pdf,png} and their provenance
    run: LINC_DATA=$LINC_PRODUCTS/data make -j 2 figures
    check: '$PY -c "import pathlib, sys; T=''template pipeline variability link tracer s_tracer_rules tracer_pathways reconstruction bf_template alignment_comparison
      s_synthesis_depth s_synthesis_gallery lgnstn histology s_tracer_fidelity tracer_sections3d''.split(); m=[t for t in T if not any(pathlib.Path(''outputs/figures'').glob(t
      + ''.*''))]; print(f''{len(T) - len(m)} of {len(T)} figures written'' + (''; missing: '' + '' ''.join(m) if m else '''')); sys.exit(1 if m else
      0)"'
    expect: every figure target wrote its file (none skipped); the drawings are not compared bit for bit
    needs: []
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 4
    disk_gb: 0.5
    hours: 0.25
    timed: clone
    optional: false
    note: '713 s with -j 2 (4 Nov clean clone): 7 of 14 byte-identical to the paper''s, 3 more under matplotlib 3.10.8, 3 differ only in the PDF date.
      The 6 Nov figures (Fig. 2 MM6, Figs. S2 and S3, the lean withheld-slab figure) are not yet in the release'
  - name: paper-check
    group: paper
    title: Compare every numbers record with the paper's
    inputs: $LINC_NUMBERS (all records of the four paper steps)
    outputs: the comparison, on screen
    run: LINC_DATA=$LINC_PRODUCTS/data make bf_camera_exif mm_mri_check_r054
    check: $PY reproduce/check_numbers.py --ref reproduce/reference --new $LINC_NUMBERS
    expect: every reference record has a regenerated record and they match ("N of N records match"; 81 of 81 at 7929dc3)
    needs: [paper-numbers, paper-numbers-gpu, paper-numbers-figures, paper-figures]
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 4
    cores: 1
    disk_gb: 0.01
    hours: 0.02
    timed: clone
    optional: false
    note: the run line regenerates the two records that hold the clone's raw paths, so a copied numbers folder cannot make them differ

  # ---- mri-template
  - name: mri-stage
    group: mri-template
    for: mri_template
    title: Stage the brain's preprocessed MRI as the build's inputs (N4, fractions)
    inputs: the preprocessed files ($LINC_MRI_PREPROCESSED/{id}); the brain masks (local_mri, built by env/lab.sh)
    outputs: $LINC_MRI_DATA/sub-{id}/mri/{dwi,t2,micro}/ and dwi/raw/ (the tensor's inputs)
    run: LINC_DATA=$LINC_MRI_DATA $PY reproduce/templates/build_mri_channels.py --step stage-{id}
    check: $PY tools/compare_mri_build.py staged $LINC_MRI_DATA/sub-{id}/mri $LINC_PRODUCTS/mri/data/sub-{id} --min 17
    expect: every staged image (23 on MF1) identical to the paper's, N4 included
    needs: []
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 8
    cores: 8
    disk_gb: 6
    hours: 0.07
    timed: clone
    optional: false
    note: 'All four brains identical from a clone on 4 Nov; MF1 again today, 231 s, 23 of 23. Steps of the build refuse to write over their own outputs:
      rerun a failed step with --force added.'
  - name: mri-tensor
    group: mri-template
    for: mri_template
    title: Fit the diffusion tensor on the b <= 4800 volumes
    inputs: mri-stage's dwi/raw/ files
    outputs: $LINC_WORK/build_mri_channels/tensor_d9/{id}/tensor_d9_dwigrid.nii.gz
    run: LINC_DATA=$LINC_MRI_DATA $PY reproduce/templates/build_mri_channels.py --step tensor-{id}
    check: $PY tools/compare_nifti.py $LINC_WORK/build_mri_channels/tensor_d9/{id} $LINC_PRODUCTS/mri/tensor_refit_d9/{id}_existing tensor_d9_dwigrid.nii.gz
    expect: the tensor identical to the paper's, voxel for voxel
    needs: [mri-stage]
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 12
    cores: 8
    disk_gb: 3
    hours: 0.13
    timed: clone
    optional: false
    note: Identical on all four brains from a clone (4 Nov); MF1 again today, 1 of 1 identical, 381 s (481 s in the paper's run).
  - name: mri-nmt
    group: mri-template
    for: mri_template
    title: Register NMT v2 to the b0 and carry its SARM labels (for the AC and PC)
    inputs: mri-stage's b0 and mask; NMT v2
    outputs: $LINC_MRI_DATA/sub-{id}/mri/landmarks/{nmt_affine_0GenericAffine.mat,SARM6_in_subject.nii.gz}
    run: LINC_DATA=$LINC_MRI_DATA $PY reproduce/templates/build_mri_channels.py --step nmt-{id}
    check: $PY tools/compare_mri_build.py nmt $LINC_MRI_DATA/sub-{id}/mri $LINC_PRODUCTS/mri/data/sub-{id} --min-agree 93
    expect: the SARM labels agree with the paper's on at least 93 % of the brain's voxels (93.3 to 94.3 % from a clone)
    needs: [mri-stage]
    gpu_gb: 16
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 4
    disk_gb: 1
    hours: 0.13
    timed: clone
    optional: false
    note: A GPU registration (ANTs, then anatomix + FireANTs); the paper's ran on an earlier version of the engine, so it is never identical. 205
      to 460 s, 11.4 to 15.3 GB of GPU memory. Run from a clone on 4 Nov; today its check was run on those outputs (93.3 to 94.3 %), the card being
      busy.
  - name: mri-t2reg
    group: mri-template
    for: mri_template
    title: Register the T2-weighted image to the b0 (one field)
    inputs: mri-stage's b0, T2 and masks
    outputs: $LINC_MRI_DATA/sub-{id}/xfm/t2-native__to__b0-native/
    run: LINC_DATA=$LINC_MRI_DATA $PY reproduce/templates/build_mri_channels.py --step t2reg-{id}
    check: $PY tools/compare_mri_build.py field t2 $LINC_MRI_DATA/sub-{id} $LINC_PRODUCTS/mri/data/sub-{id} --median 0.05 --largest 1.0
    expect: the field within a median of 0.05 mm and at most 1 mm of the paper's inside the brain (0.009 to 0.037 mm, largest 0.84 mm from a clone)
    needs: [mri-stage]
    gpu_gb: 16
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 4
    disk_gb: 1
    hours: 0.1
    timed: clone
    optional: false
    note: 'GPU registration: not identical between GPU sessions, even on one card model. 205 to 413 s, 13.9 to 15.6 GB of GPU memory. Run from a clone
      on 4 Nov; today its check was run on those outputs.'
  - name: mri-microreg
    group: mri-template
    for: [MF283]
    title: Register the microstructure session's b0 to the b0 (one field)
    inputs: mri-stage's b0 images and masks of both sessions
    outputs: $LINC_MRI_DATA/sub-{id}/xfm/micro-native__to__b0-native/
    run: LINC_DATA=$LINC_MRI_DATA $PY reproduce/templates/build_mri_channels.py --step microreg-{id}
    check: $PY tools/compare_mri_build.py field micro $LINC_MRI_DATA/sub-{id} $LINC_PRODUCTS/mri/data/sub-{id} --median 0.05 --largest 2.5
    expect: the field within a median of 0.05 mm and at most 2.5 mm of the paper's inside the brain (0.033 mm, largest 1.9 mm on MF1)
    needs: [mri-stage]
    gpu_gb: 23
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 4
    disk_gb: 1
    hours: 0.15
    timed: clone
    optional: false
    note: 'Needs 22.1 GB of GPU memory as nvidia-smi counts it: a 48 GB card, not a 20 GB one. 379 s on MF1 (4 Nov).'
  - name: mri-microreg
    group: mri-template
    for: [MF284, MF285, MF286]
    title: Register the microstructure session's b0 to the b0 (one field)
    inputs: mri-stage's b0 images and masks of both sessions
    outputs: $LINC_MRI_DATA/sub-{id}/xfm/micro-native__to__b0-native/
    run: LINC_DATA=$LINC_MRI_DATA $PY reproduce/templates/build_mri_channels.py --step microreg-{id}
    check: $PY tools/compare_mri_build.py field micro $LINC_MRI_DATA/sub-{id} $LINC_PRODUCTS/mri/data/sub-{id} --median 0.05 --largest 2.5
    expect: the field within a median of 0.05 mm and at most 2.5 mm of the paper's inside the brain (the tolerance of MF1)
    needs: [mri-stage]
    gpu_gb: 23
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 4
    disk_gb: 1
    hours: 0.15
    timed: estimated
    optional: false
    note: 'Never rerun on MF2 to MF4 (docs/mri.md says so): this is its first test, and the tolerance is MF1''s. A 48 GB card.'
  - name: mri-frames
    group: mri-template
    for: mri_template
    title: Find the AC and PC, then the brain's canonical frame
    inputs: mri-nmt's labels and affine; mri-stage's b0 and mask
    outputs: $LINC_MRI_DATA/sub-{id}/mri/landmarks/{landmarks.json,canonical.json}
    run: LINC_DATA=$LINC_MRI_DATA $PY reproduce/templates/build_mri_channels.py --from landmarks-{id} --to frames-{id}
    check: $PY tools/compare_mri_build.py frame $LINC_MRI_DATA/sub-{id}/mri $LINC_PRODUCTS/mri/data/sub-{id} --deg 1.0 --mm 0.5
    expect: the frame within 1 degree and a mean move of 0.5 mm of the paper's (0.04 to 0.81 degrees, 0.09 to 0.31 mm from a clone)
    needs: [mri-nmt]
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 4
    cores: 2
    disk_gb: 0
    hours: 0.03
    timed: clone
    optional: false
    note: 'From the clone''s own NMT registration the plane fit can land on another optimum: on MF4 (MF286) 0.81 degrees from the paper''s plane,
      close to the 1 degree limit.'
  - name: mri-prepare
    group: mri-template
    for: mri_template
    title: Resample every channel onto the canonical grid, cut to the mask, mirror
    inputs: mri-frames' frame; mri-tensor's tensor; mri-t2reg's and mri-microreg's fields; the staged images; the final mask
    outputs: $LINC_WORK/build_mri_channels/prep/{id}/ (the construction inputs and their _flip mirrors)
    run: LINC_DATA=$LINC_MRI_DATA $PY reproduce/templates/build_mri_channels.py --step prepare-{id}
    check: $PY tools/compare_mri_build.py prepare $LINC_WORK/build_mri_channels/prep/{id} $LINC_PRODUCTS/mri/data/sub-{id}/canonical_rebuild_handfrac
    expect: inside both masks, r with the paper's of at least 0.88 (T2), 0.87 (b0), 0.84 (fractions), 0.98 (tensor), mask Dice at least 0.97
    needs: [mri-frames, mri-tensor, mri-t2reg, mri-microreg]
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 4
    disk_gb: 1
    hours: 0.05
    timed: clone
    optional: false
    note: 'Never identical: every image goes through the rerun''s frame. From a clone (4 Nov, MF2 to MF4 with the paper''s microreg): MF4 (MF286)
      T2 r 0.885, b0 0.879, fractions 0.871 and 0.845, tensor 0.981, Dice 0.979, near the limits; with its own microreg it was never run.'
  - name: mri-assemble
    group: mri-template
    title: Write the MMORF run folder from the paper's construction inputs
    inputs: the paper's construction inputs ($LINC_PRODUCTS/mri/data/sub-<ID>/canonical_rebuild_handfrac); configs/mri_construction.yaml
    outputs: $LINC_WORK/mri_construction/runs/rb_final/ (config/, subject_ids.csv, standardspace.nii.gz, data/ links, run_spec.json)
    run: mkdir -p $LINC_WORK/mri_construction/prep && for S in MF283 MF284 MF285 MF286; do ln -sfn $LINC_PRODUCTS/mri/data/sub-$S/canonical_rebuild_handfrac
      $LINC_WORK/mri_construction/prep/$S; done && $PY reproduce/templates/build_mri_channels.py --work $LINC_WORK/mri_construction --step assemble
    check: $PY tools/compare_mri_build.py run $LINC_WORK/mri_construction/runs/rb_final $LINC_PRODUCTS/mri/tc/rb_final --parts config subject_ids.csv
      standardspace.nii.gz --min 16
    expect: the 14 parameter files, the subject list and the standard space identical to the paper's run (16 of 16)
    needs: []
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 2
    cores: 1
    disk_gb: 0.1
    hours: 0.01
    timed: clone
    optional: false
    note: 'The construction starts from the paper''s inputs, not from mri-prepare''s, so that its comparison can be exact. Today from a clone: 11
      s, 16 of 16.'
  - name: mri-construction-step1
    group: mri-template
    title: Run the groupwise construction through its affine stage and step 1
    inputs: mri-assemble's run folder; MMORF 1.0.1 ($LINC_MMORF_EXE); the patched driver ($LINC_TEMPLATE_DRIVER)
    outputs: $LINC_WORK/mri_construction/runs/rb_final/out/{affine_step1,affine_step2,nln_step_01}/
    run: $PY tools/run_until.py $LINC_WORK/mri_construction/runs/rb_final/out/scripts/021_nlnT_mmorf.sh -- $PY reproduce/templates/build_mri_channels.py
      --work $LINC_WORK/mri_construction --step mmorf
    check: $PY tools/compare_mri_build.py run $LINC_WORK/mri_construction/runs/rb_final/out $LINC_PRODUCTS/mri/tc/rb_final/out --parts affine_step1
      affine_step2 nln_step_01 --skip-ini --min 202
    expect: every file the paper kept of its affine stage and step 1 identical, byte for byte or voxel for voxel (202 of 202)
    needs: [mri-assemble]
    gpu_gb: 6
    gpu_model: RTX 6000 Ada
    gpu_alone: true
    ram_gb: 32
    cores: 8
    disk_gb: 30
    hours: 2
    timed: clone
    optional: false
    note: 'Stops the driver when step 2''s first task is written. 4 Nov from a clone on a shared RTX 6000 Ada: 202 of 202 identical, 3.9 GB of GPU
      memory at most, 2.9 h with one stop and resume (the paper''s run: 7 min + 1.2 h). The plan asks for the card alone; the 4 Nov run shared the card
      and was still identical. run_until.py is new (tested today on a small command); the 4 Nov run was stopped the same way by a script.'
  - name: mri-construction-full
    group: mri-template
    title: Run the whole groupwise construction (8 steps), 3.5 days on one card
    inputs: the paper's construction inputs; MMORF 1.0.1; the patched driver
    outputs: '$LINC_WORK/mri_construction_full/runs/rb_final/out/ (nln_step_08/iteration_03: the warps the channels read)'
    run: mkdir -p $LINC_WORK/mri_construction_full/prep && for S in MF283 MF284 MF285 MF286; do ln -sfn $LINC_PRODUCTS/mri/data/sub-$S/canonical_rebuild_handfrac
      $LINC_WORK/mri_construction_full/prep/$S; done && $PY reproduce/templates/build_mri_channels.py --work $LINC_WORK/mri_construction_full --from
      assemble --to mmorf
    check: $PY tools/compare_mri_build.py run $LINC_WORK/mri_construction_full/runs/rb_final/out $LINC_PRODUCTS/mri/tc/rb_final/out --parts nln_step_08
      --skip-ini --min 175
    expect: the final step's 175 files identical to the paper's run (steps 2 to 8 never rerun)
    needs: []
    gpu_gb: 46
    gpu_model: RTX 6000 Ada
    gpu_alone: true
    ram_gb: 64
    cores: 8
    disk_gb: 100
    hours: 84.5
    timed: paper's run
    optional: true
    note: 'Never rerun past step 1. The paper''s run: 30 Sep 14:39 to 4 Oct 02:59 on one card, alone, batch 8 for steps 1-5, 4 for 6-7, 4 then 3 for
      8 (the batch does not change results). After a stop: add -aff False -resume <step>:<iteration> through the driver (reproduce/templates/mri_channels.md).'
  - name: mri-channels
    group: mri-template
    title: Make the template's MRI channels from the paper's construction run
    inputs: the paper's run ($LINC_PRODUCTS/mri/tc/rb_final, step 8 iteration 3); the brains' native images, fields and construction inputs of record
    outputs: $LINC_WORK/mri_paper_run/channels/linc_mri_*.nii.gz and provenance.json
    run: W=$LINC_WORK/mri_paper_run && mkdir -p $W/prep $W/runs && ln -sfn $LINC_PRODUCTS/mri/tc/rb_final $W/runs/rb_final && for S in MF283 MF284
      MF285 MF286; do mkdir -p $W/data/sub-$S && ln -sfn $LINC_PRODUCTS/mri/data/sub-$S $W/data/sub-$S/mri && ln -sfn $LINC_PRODUCTS/mri/data/sub-$S/xfm
