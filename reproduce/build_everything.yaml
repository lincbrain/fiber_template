  # ---- training
  - name: training-segment-mri-brainmask
    group: training
    title: Train the MRI brain-mask segmentation model again (all brains)
    inputs: configs/segment/mri_brainmask.json and the hand-corrected MRI masks it lists (records)
    outputs: $LINC_WORK/segment/runs/mri_brainmask/fold_all/model.pt, spec.json, record.json
    run: $PY_DEEP cli/linc-segment train --task configs/segment/mri_brainmask.json --fold all
    check: cmp $LINC_WORK/segment/runs/mri_brainmask/fold_all/model.pt $LINC_MODELS/segment/mri_brainmask/model.pt && echo "model.pt byte-identical
      to the released mri_brainmask model"
    expect: the trained model.pt byte-identical to the released one
    needs: []
    gpu_gb: 10
    gpu_model: RTX 6000 Ada
    gpu_alone: false
    ram_gb: 32
    cores: 8
    disk_gb: 5
    hours: 2
    timed: docs
    optional: true
    note: byte-identical once (4 Nov, on an RTX 6000 Ada); other card models and the other three segmentation models were not retrained
  - name: training-synthesis
    group: training
    title: Train the synthesis network again (the 13 brains with MRI)
    inputs: the 13 prepared folders of record ($LINC_COMPLETION_PREPARED)
    outputs: $LINC_WORK/completion/d3_full_retrain/last.pt, train_log.jsonl
    run: $PY_DEEP cli/linc-complete train --root $LINC_COMPLETION_PREPARED --out $LINC_WORK/completion/d3_full_retrain
    check: test -s $LINC_WORK/completion/d3_full_retrain/last.pt && tail -n 1 $LINC_WORK/completion/d3_full_retrain/train_log.jsonl
    expect: trained to the recipe's last epoch (its last log line shown); not compared bit for bit, since the recipe does not give the same bits
    needs: []
    gpu_gb: 8
    gpu_model: ''
    gpu_alone: false
    ram_gb: 32
    cores: 8
    disk_gb: 1
    hours: 1
    timed: docs
    optional: true
    note: 'retrained once (on an RTX 6000 Ada): last-10-epoch loss within 0.06 %, MF5''s synthesized tissue r = 0.95 against the released network (docs/complete.md)'
