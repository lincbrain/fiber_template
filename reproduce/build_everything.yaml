      --overwrite
    check: $PY tools/compare_registration.py entry $LINC_DATA/sub-{id}/xfm/bf-native__to__mri-template $LINC_DATA/sub-{id}/xfm_record/bf-native__to__mri-template
    expect: the paper's alignment, its linear part identical and its warp identical or within a median of 0.05 mm and a 99th percentile of 0.5 mm
