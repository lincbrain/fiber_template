  - name: qc-direct
    group: registration
    for: without_mri
    title: Check the cross-modal alignment (NCC, folds, outline on the covered template)
    inputs: $LINC_WORK/direct_placement/{id}/ and the entry $LINC_DATA/sub-{id}/xfm/bf-native__to__mri-template
    outputs: $LINC_WORK/qc/{id}.json and .png; the verdict in the entry's meta.json
    run: P=$LINC_WORK/direct_placement/{id} && $PY cli/linc-register qc --preset direct --fixed $P/_fixed_0.25.nii.gz --moved $P/{id}_bf_in_template.nii.gz
      --warp $P/{id}_warp.nii.gz --mat $P/{id}_linear_world.txt --mat-kind world --fixed-mask $P/_fixed_mask_0.25.nii.gz --moved-mask $P/{id}_mask_in_template.nii.gz
      --outline-target $P/_fixed_mask_0.25.nii.gz --entry $LINC_DATA/sub-{id}/xfm/bf-native__to__mri-template --name {id}
    check: '$PY -c "import json, sys; q = json.load(open(sys.argv[1]))[''qc'']; print(sys.argv[2] + '': QC '' + q[''status''] + '' (expected '' +
      sys.argv[3] + ''); outline '' + str(q.get(''outline'')) + ''; reasons '' + str(q.get(''reasons''))); sys.exit(q[''status''] != sys.argv[3])"
      $LINC_DATA/sub-{id}/xfm/bf-native__to__mri-template/meta.json {id} pass'
    expect: QC pass, the verdict the same QC gives on the paper's alignment of each of the 8 (outline WARN, which passes, on MM13 and MM14)
    needs: [direct-placement]
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 8
    cores: 2
    disk_gb: 0.1
    hours: 0.02
    timed: clone
    optional: false
    note: 'Tested 6 Nov: on MF8''s rerun, PASS (28 s, 1.9 GB RAM); the same qc on the paper''s own alignments of all 8 gives PASS.'
