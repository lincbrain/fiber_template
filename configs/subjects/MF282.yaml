# MF282: the per-brain inputs of its blockface reconstruction, as used for the paper (from the analysis project's
# code/config.py + code/macaque_datasets.xlsx). Hand inputs: spacing (vx, vz um), camera jumps, missing sections and the
# caudal cutoff (see linc/blockface/subject.py). `raw` is relative to $LINC_RAW.
# registration_to_own_mri: the inputs of record of the registration to the brain's own b0 (R1 v3): the b0 mask (paths relative to
# mri/), the fixed b0, and the start pose (world, blockface -> b0 on the template grid), recovered from the run's saved init matrix.
subject: MF282
raw: blockface_curated/MF282
raw_glob: '*.JPG'
raw_regex: Img(\d+)\.JPG
idx_range: [70828, 72120]
reduce: mean
rotate180: true
vx: 27.0
vz: 47.0
jumps:
- [1145, 1146]
missing:
- [354, 357]
- [358, 361]
- [402, 404]
- [404, 406]
- [426, 428]
- [439, 441]
- [469, 471]
- [509, 511]
- [525, 527]
- [542, 544]
- [577, 579]
- [668, 670]
- [691, 693]
- [806, 809]
- [847, 853]
- [853, 858]
- [858, 873]
- [873, 875]
- [948, 950]
- [1016, 1018]
- [1043, 1046]
- [1085, 1087]
- [1166, 1168]
- [1211, 1213]
- [1285, -1]
histo_vx: 0.0
histo_vz: 0.0
ccs: 0
cce: 0
mri: ''
stack_pad: 0
jump_mode: affine
# reconstruction_spacing_um: the pixel size and section step the volume was REBUILT at (its pixels depend on them, e.g. the
# intensity smoothing width in sections); vx/vz above are the calibrated spacing written into the headers afterwards by a
# header-only rescaling about the world origin (linc/blockface/spacing.py; pixels unchanged). Equal for a new brain.
# curation_f: native sections per curated (0.40 mm) slice of the hand-edit grid, pinned at the reconstruction spacing.
reconstruction_spacing_um: {vx: 26, vz: 50}
curation_f: 8
# native_end_crop_mm: this brain's own last photographed sections are darker, so the product steps drop the last
# round(mm / vz) of them before resampling (the analysis project's synthesis/v2/native_crop*.json). Read by the registration
# to the brain's own MRI (its products) and by the blockface template's member preparation; the direct routes did not apply it.
native_end_crop_mm: 3.0
registration_to_own_mri:
  variant_of_record: r1v3
  b0_mask: MF282_mri_mask.nii.gz
  b0_mask_source: the b0 brain mask of record
  fixed_b0: MF282_mri.nii.gz
  start_pose_world:
  - [0.998327300358785, 0.021350129280293114, 0.053728701250401634, -61.49255451124313]
  - [-0.01636054561333103, 0.9956568932075165, -0.09164978753706884, -27.05530969957043]
  - [-0.05545208657547753, 0.09061745410278595, 0.9943407580434157, -38.9800422732822]
  - [0.0, 0.0, 0.0, 1.0]
# masks_of_record: the masks this brain's reconstruction of record used, and which of them were corrected by hand (paths
# relative to sub-<ID>/blockface/). A hand-edited curated file wins over the 3D models' outputs in linc-reconstruct.
masks_of_record:
  photo_masks_2d:
    folder: 01_brainmask/01_final
    hand_edited: false
    note: the 2D model's output, unchanged
  brain_mask_3d:
    file: curated/MF282_mask_edited.nii.gz
    hand_edited: true
  tubes_3d:
    file: curated/MF282_holes_edited.nii.gz
    hand_edited: true
