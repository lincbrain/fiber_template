# MF204: the per-brain inputs of its blockface reconstruction, as used for the paper (from the analysis project's
# code/config.py + code/macaque_datasets.xlsx). Hand inputs: spacing (vx, vz um), camera jumps, missing sections and the
# caudal cutoff (see linc/blockface/subject.py). `raw` is relative to $LINC_RAW.
subject: MF204
raw: blockface_curated/MF204
raw_glob: '*.JPG'
raw_regex: DSC_(\d+)\.JPG
idx_range: [1, 71]
reduce: mean
rotate180: true
vx: 43.0
vz: 810.0
jumps:
- [2, 3]
- [7, 8]
- [15, 16]
- [20, 21]
- [24, 25]
- [34, 35]
- [35, 36]
- [36, 37]
- [39, 40]
- [44, 45]
- [51, 52]
- [54, 55]
- [66, 67]
- [68, 69]
missing:
- [27, 29]
histo_vx: 0.0
histo_vz: 0.0
ccs: 0
cce: 0
mri: ''
stack_pad: 0
jump_mode: affine
# reconstruction_spacing_um: the pixel size and section step the volume was REBUILT at (its pixels depend on them, e.g. the
# intensity smoothing width in sections); vx/vz above are the calibrated spacing written into the headers afterwards by a
# header-only rescaling about the world origin (linc/blockface/spacing.py; pixels unchanged). Equal for a new brain.
# curation_f: native sections per curated (0.40 mm) slice of the hand-edit grid, pinned at the reconstruction spacing.
reconstruction_spacing_um: {vx: 43, vz: 810}
curation_f: 1
# native_end_crop_mm: this brain's own last photographed sections are darker, so the product steps drop the last
# round(mm / vz) of them before resampling (the analysis project's synthesis/v2/native_crop*.json). Read by the registration
# to the brain's own MRI (its products) and by the blockface template's member preparation; the direct routes did not apply it.
native_end_crop_mm: 1.62
# masks_of_record: the masks this brain's reconstruction of record used, and which of them were corrected by hand (paths
# relative to sub-<ID>/blockface/). A hand-edited curated file wins over the 3D models' outputs in linc-reconstruct.
masks_of_record:
  photo_masks_2d:
    folder: null
    hand_edited: true
    note: 'not kept: a hand-edited L2 mask of the aligned stack was carried into the 3D brain mask (below)'
  brain_mask_3d:
    file: curated/MF204_mask_edited.nii.gz
    hand_edited: true
    note: the 3D model's mask restricted to the hand-edited L2 mask (+1 L4 voxel in-plane), largest component; removes a non-brain
      strip the model re-added at sections ~43-56
  tubes_3d:
    file: curated/MF204_holes_edited.nii.gz
    hand_edited: true
