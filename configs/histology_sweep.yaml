# The nine settings of the histology registration test (paper: Supplementary S4, Table S7; records tirl_sweep_r058 and
# tirl_sweep_r058b, kept in reproduce/reference). Each setting changes one value of configs/histology.yaml (dotted keys; the TIRL
# parameters are under tirl.config); C0 is the settings of record. C8 and C9 were chosen after the C1-C6 result (tirl_sweep_r058b,
# its post_hoc field). linc/histology/README.md lists them. To register one piece with one setting:
#   python -m linc.histology.sweep C2 > histology_C2.yaml
#   cli/linc-histology register --config histology_C2.yaml --pieces <piece> --out <folder> ...
C0: {}
C1: {tirl.config.regparams.nonlinear.regweight: 0.15}
C2: {tirl.config.regparams.nonlinear.regweight: 0.60}
C3: {tirl.config.regparams.init.affine.lb: [0.90, -0.2, -1.0, -0.2, 0.90, -1.0],
     tirl.config.regparams.init.affine.ub: [1.10, 0.2, 1.0, 0.2, 1.10, 1.0]}
C4: {tirl.config.regparams.rotsearch.coarse: 2}
C5: {tirl.config.histology.mask.automask: {thr: 0.02, uthr: 1}, tirl.config.block.mask.automask: {thr: 0.02, uthr: 1}}
C6: {tirl.config.regparams.nonlinear.truncate: 3.0}
C8: {tirl.config.regparams.nonlinear.regweight: 0.40}
C9: {tirl.config.regparams.nonlinear.regweight: 0.45}
