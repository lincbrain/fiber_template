# Our MRI template as a registration target for ex vivo brains, against NMT v2 (symmetric, in vivo T1w) and CIVM-R (ex vivo b0), with
# ONE engine and ONE setting for all three targets. Paper: Methods, "The template as a registration target" (sec:m-target); Results,
# Table 3. Code: linc/evaluation/targets.py (driver); the engine is linc/link/symreg.py, the ANTs start is linc/link/ants.py.
# Ported from the analysis project's mri/code/r060_targets.py (runs of record: mri/tc/r060_up); values are those of the runs of record.
#
# The published templates are NOT redistributed. Download them and point configs/link.yaml `inputs.atlas_reference` ({ref}) at a folder
# holding them in this layout:
#   NMT v2.0 symmetric: https://afni.nimh.nih.gov/pub/dist/atlases/macaque/nmt/NMT_v2.0_sym.tgz (unpack as {ref}/NMT_v2.0_sym/)
#   CIVM-R (Calabrese et al. 2015, NeuroImage 117:408-416): https://www.civm.duhs.duke.edu/rhesusatlas (academic use; permission from
#     CIVM before publishing work that uses it). The b0, brain mask and FA below are the brain-extracted files the paper used
#     ({ref}/CIVM-R_T2_DTI/), made from the distribution's civm_rhesus_v1_* volumes.

# --- targets: image (the channel every brain's b0 is registered to), brain mask, extra channels of the multi arm ---
# {ref} = configs/link.yaml inputs.atlas_reference; {prod} = $LINC_PRODUCTS. Every channel is multiplied by its brain mask (prep).
targets:
  nmt:   {space: "atlas:NMT_v2.0_sym", msk: "{ref}/NMT_v2.0_sym/NMT_v2.0_sym/NMT_v2.0_sym_brainmask.nii.gz",
          ch: {img: "{ref}/NMT_v2.0_sym/NMT_v2.0_sym/NMT_v2.0_sym_SS.nii.gz"}}
  civmr: {space: "atlas:CIVM-R", msk: "{ref}/CIVM-R_T2_DTI/CIVM-R_brain_mask.nii.gz",
          ch: {img: "{ref}/CIVM-R_T2_DTI/CIVM-R_b0_brain.nii.gz", FA: "{ref}/CIVM-R_T2_DTI/CIVM-R_DTI_FA.nii.gz"}}
  ours:  {space: "mri-template", msk: "{prod}/template/mri/linc_mri_brainmask.nii.gz",
          ch: {img: "{prod}/template/mri/linc_mri_b0.nii.gz", T2: "{prod}/template/mri/linc_mri_T2.nii.gz", FA: "{prod}/template/mri/linc_mri_FA.nii.gz"}}

# --- brains: the 13 sectioned brains with MRI (out of sample for every target: the headline) and the 4 that built our template ---
brains:
  sectioned: [MF275, MF278, MF282, MR243, MR249, MR250, MR251, MR252, MR253, MR254, MR256, MR257, MR261]
  template: [MF283, MF284, MF285, MF286]

# --- each brain's images of record (relative to $LINC_PRODUCTS) ---
inputs:
  sectioned:
    b0: data/sub-{ID}/mri/{ID}_mri_b0_native.nii.gz
    mask: data/sub-{ID}/mri/{ID}_mri_mask_native.nii.gz
    place_mat: data/sub-{ID}/mri/{ID}_mri2template.mat      # the FLIRT 6-dof placement of record (with {ID}_mri.nii.gz) -> upright P0
    place_ref: data/sub-{ID}/mri/{ID}_mri.nii.gz
    r5_entry: data/sub-{ID}/xfm/b0-native__to__mri-template  # the paper's own b0 -> template registration (reference row)
  template:                                                  # the construction's own b0 inputs and the author's final masks
    b0: mri/data/sub-{ID}/canonical_rebuild_handfrac/_native/b0_head_n4.nii.gz
    mask: mri/data/sub-{ID}/canonical_rebuild_handfrac/model_mask_source_uint8.nii.gz
    canonical: mri/data/sub-{ID}/landmarks/canonical.json    # T_subject_to_canonical -> upright P0
    t2: mri/data/sub-{ID}/t2/echo_n4.nii.gz                  # pulled to b0-native by the within-brain registration of record:
    t2_reg: mri/data/sub-{ID}/reg/t2_to_dwi_v3               #   meta.json pull_chain
    fa: mri/data/sub-{ID}/dwi/dti_FA.nii.gz
  bridge: template/bridge_run113_to_canonical/linear.json    # rigid run-113 frame -> canonical frame (key rigid_world_run113_to_canonical)

# --- arms ---
# b0     every brain: its b0 <-> the target's image (nmt: b0 <-> T1w)
# multi  the 4 template brains with the channels each target has, so NOT like-for-like across targets
multi:
  nmt:   {B: T2, pairs: []}                     # brain T2 <-> NMT v2 T1w
  civmr: {B: b0, pairs: [[FA, FA]]}             # b0 <-> CIVM-R b0 + FA <-> CIVM-R FA
  ours:  {B: b0, pairs: [[T2, T2], [FA, FA]]}   # b0 <-> our b0 + T2 <-> our T2 + FA <-> our FA

# --- start and solve ---
upgrid: {res_mm: 0.25, pad_mm: 4.0}             # upright images resampled once onto an axis-aligned grid: mask box + 4 mm
start_dice_step: 2                               # candidate starts scored on every 2nd voxel of the target's mask grid
engine: {res: 0.25, smooth_warp_sigma: 1.25, channel_chunk: 8, max_gpu_frac: 0.95}   # channel_chunk 4 or 2 on 20 GB cards (memory only)

# --- measures (each target's own 0.25 mm grid; pairs of different brains) ---
measure:
  rim_erosions: 6                                # b0 r inside both warped masks minus a 1.5 mm rim (6 erosions at 0.25 mm)
  min_core_voxels: 100
  point_chunk: 2000000
