# Records that cannot regenerate identically because their inputs changed after they were written, for reasons the paper
# reports elsewhere. check_numbers.py compares them only on the fields the paper reads. Each entry needs the owner's reason.
# Two more kinds of entry, listed by check_numbers.py instead of failing it: no_reference (a by-product with no reference record) and
# not_regenerated (a reference this release does not regenerate).
bf_cohort:
  reason: "written 28 Sep 2026; the 2 Oct spacing calibration (18 brains: vx_um, vz_um, L1_inplane_um, isotropic_cap_mm, brain_volume_ml) and the later MM8/MM9 MRI-mask edits (mri_brain_volume_ml) changed its inputs; the regenerated record is the current state"
  # the paper reads: bf_cohort.rows|len, bf_cohort.rows.mri_tier!=.*.subject|len, bf_cohort.rows.subject=<ID>.0.mri_voxel_mm (13 brains)
  compare: ["rows|len", "rows.*.subject", "rows.*.mri_tier", "rows.*.mri_voxel_mm"]
bf_species:
  reason: "its blockface_template and utility blocks counted the brains of a superseded template build (T1 v2b k1) and its utility test; the paper reads only the per-brain species, so those blocks are not regenerated"
  # the paper reads: bf_species.per_brain.<ID>.short (21 brains)
  compare: ["rule", "per_brain|len", "per_brain.*.species", "per_brain.*.short", "per_brain.*.species_of_record", "blockface_cohort"]
fig_routes_1c_section:
  reason: "the record names the figure file it was written with (its `figure` field: the analysis project's output path); every other field is regenerated"
  # the paper reads: fig_routes_1c_section.section_nmt_y_mm
  compare: ["example_pair", "brains", "section_index_ijk", "section_nmt_y_mm", "crop_height_pct", "fov_mm"]
bf_sanity:
  reason: "written 27 Sep 2026, before the 2 Oct spacing calibration rescaled 18 brains' headers (their extents, slice steps and centroid steps); the regenerated record is the current state"
  # the paper reads: bf_sanity.n ("All 21 photographed stacks were reconstructed")
  compare: ["n", "rows|len", "rows.*.subject"]

d3_domain_shift:
  reason: "GPU predictions: the code of record (isbi2027 domain_shift_v3.py), rerun on the same card model (RTX 6000 Ada) and env (env/completion.yml), gives the port's values exactly; both differ from the 4 Oct record by at most 6e-4 (one PSNR, dB) and by 6e-6 in summary.ssim.mean_own (0.683718 vs 0.683712), which the paper prints to 2 decimals (0.68 in both); the record's own run is not reproducible bitwise"
  # the paper reads: d3_domain_shift.summary.ssim.mean_own (|.2f), d3_domain_shift.summary.ssim.n
  compare: ["summary.ssim.n", "summary.ssim.mean_own", "per_brain|len"]
  tol: 1.0e-4

r057_s1_synthesis:
  reason: "a record of copies: its isbi block is copied unchanged from the number records of the synthesis network's own paper (products isbi_numbers, dated snapshots; this release does not recompute that paper's evaluations), its precision block from two records of record (numbers_of_record); every value is compared, and every source's md5 except the brain-name file's: the release reads the names from docs/specimen_labels.json (the same mapping as the record's paper/numbers/specimen_labels.json, another file), and the sources' paths name the machine that ran it"
  # the paper reads: r057_s1_synthesis.isbi.*, .precision.*, .inference.* (Supplementary S1.2-S1.4)
  compare: ["what", "isbi", "precision", "inference", "evaluated", "sources.table1_v3.md5", "sources.extra_v3.md5", "sources.results_v3.md5",
            "sources.data_v3.md5", "sources.compute_v3.md5", "sources.brain_labels_v4.md5", "sources.precision_weights_b1_d2b_s8.md5",
            "sources.d3_A_sigma2_pred_flat.md5", "sources.tau2_json.md5"]
  # sources.completion_yaml.md5 is not compared: that file's text changes with comments and moved parameters; the values it supplies are compared (inference, precision)

fig_tracer_r058:
  reason: "written by the tracer figure's script (reproduce/figures/tracer.py): its free-text method field is that script's docstring and its outputs field the figure files it wrote, which name the analysis project's variant script and paths; every value is regenerated"
  # the paper reads: fig_tracer_r058.mf8_unbridged_outlined.share_unbridged
  compare: ["cases", "voxel_mm3", "rules", "groups", "slab", "colors", "mirrored_for_display", "alic_counts_slab_solid", "injection_sites_b",
            "mf8_unbridged_outlined"]

# Reference only: records of a test whose inputs this release does not ship. No script in reproduce/numbers writes them, so
# `make check` does not compare them. A record regenerated elsewhere is compared on the fields below.
tirl_sweep_r058:
  reason: "not regenerated by this release: the histology registration test of Supplementary S4 (Table S7). Regenerating it means 284 pieces x 7 settings (C0-C6, configs/histology_sweep.yaml) of `linc-histology register` on the inputs of record (fixed: the blockface with the marker tubes inpainted; moving: from the corrected tissue masks), each piece then scored by the hidden-tube rule of tube_offsets_r054 (hole_hidden) and by tissue Dice, under the decision rule in the record's method field. The TIRL outputs of the test (data_tirl_sweep) are not released, so its scoring script (the analysis project's labels/tirl_sweep/score_sweep.py) is not either; linc/histology/README.md shows how to rerun one setting on one piece"
  not_regenerated: true
  # the paper reads: tirl_sweep_r058.candidates.<C0-C6>.{n_pieces, found, failed, tube_window_outside_histology, pooled.median_mm,
  # pooled.c0_median_mm, brains_improved, dice_nonlinear_median, dice_nonlinear_below_085}, .c0_vs_record.{c0_found, c0_median_mm,
  # record_median_mm}, .rule.{gain_mm, brains_min, dice_tol, lobo_min}, .lobo.stable_count.C2 (Supplementary S4, Table S7)
  compare: ["rule", "candidates.*.n_pieces", "candidates.*.found", "candidates.*.failed", "candidates.*.tube_window_outside_histology",
            "candidates.*.pooled", "candidates.*.brains_improved", "candidates.*.dice_nonlinear_median",
            "candidates.*.dice_nonlinear_below_085", "candidates.*.decision", "lobo", "c0_vs_record", "adopt", "passing", "c7_needed"]
tirl_sweep_r058b:
  reason: "not regenerated by this release: tirl_sweep_r058 plus two settings chosen after its result (C8, C9: regularization weight 0.40 and 0.45; the record's post_hoc field), the same 284 pieces, inputs, scoring and rule; regenerating it means the 284 x 9 runs of `linc-histology register` (C0-C6, C8, C9) and the scoring described for tirl_sweep_r058, which this release does not ship"
  not_regenerated: true
  # the paper reads: tirl_sweep_r058b.candidates.<C8, C9>.{found, failed, pooled.median_mm, pooled.c0_median_mm, pooled.gain_mm,
  # brains_improved, dice_nonlinear_median, dice_nonlinear_below_085} (Supplementary S4, Table S7)
  compare: ["post_hoc", "rule", "candidates.*.n_pieces", "candidates.*.found", "candidates.*.failed",
            "candidates.*.tube_window_outside_histology", "candidates.*.pooled", "candidates.*.brains_improved",
            "candidates.*.dice_nonlinear_median", "candidates.*.dice_nonlinear_below_085", "candidates.*.decision", "lobo",
            "c0_vs_record", "adopt", "passing", "c7_needed"]
tracer_side_check_r058d:
  reason: "not regenerated by this release: the injection-side check of the pushed tracer sheets (per case and class, the pixels on the injection's side of the blockface midline, from the per-piece push records and the photographs' midline), an audit of the chain run on the audit's registration arm (data_arm_preinp_r058 / r058c), which is not a release product; the v2 chain of record starts from the same sheets, so the check stands"
  not_regenerated: true
  # the paper reads: tracer_side_check_r058d.cases.<S>.totals.<class> (Supplementary S2, the side check)
  compare: ["cases.*.totals"]
tracer_match_audit_r058:
  reason: "not regenerated by this release: the slice-match audit (per registered piece, the normalized mutual information of the registered section against its matched blockface photograph and its neighbors, the best slice and the margin), run on the audit's registration arms (data_arm_preinp_r058 / r058c) and the photographs, which are not release products; its two credible offsets are the re-matches the chain of record carries (tracer_template_v2_all.audit_rematch)"
  not_regenerated: true
  # the paper reads: tracer_match_audit_r058.cases.<S>.* (Supplementary S2, the match audit)
  compare: ["cases"]
tracer_fix_validation_r058:
  reason: "not regenerated by this release: the validation of the tracer fix (the pieces re-registered on the two arms, preinp and final, and the sheets' coverage per case) on the audit's registration arms, which are not release products"
  not_regenerated: true
  # the paper reads: tracer_fix_validation_r058.arms.final.<S>.reregistered|len, .coverage.<S>.* (Supplementary S2)
  compare: ["arms", "coverage"]
MANIFEST:
  reason: "the reference folder's list of its records, not a record"
  not_regenerated: true
lgnstn_targets_r060b:
  reason: "history: lgnstn_targets_r060c replaces it in the paper and reads it as an input"
  not_regenerated: true
d3_A_sigma2_pred:
  reason: "written by d3_sigma2_pred; the paper's text does not read this curve, so it has no reference (d3_methods, which reads it, is compared)"
  no_reference: true
d3_A_sigma2_pred_flat:
  reason: "written by d3_sigma2_pred; the paper's text does not read this curve, so it has no reference (d3_methods, which reads it, is compared)"
  no_reference: true
d3p_A_sigma2_pred:
  reason: "written by d3_sigma2_pred; the paper's text does not read this curve, so it has no reference (d3_methods, which reads it, is compared)"
  no_reference: true
d3p_A_sigma2_pred_flat:
  reason: "written by d3_sigma2_pred; the paper's text does not read this curve, so it has no reference (d3_methods, which reads it, is compared)"
  no_reference: true
lobo_multichannel_cost_r061:
  reason: "not regenerated without the construction's run logs, which are not released: registration times read from those logs. The reference leaves out the record's free-text method and its list of log files; with the logs, every value is regenerated"
  not_regenerated: true
  # the paper reads: lobo_multichannel_cost_r061.card_hours.multichannel_step6_32_inputs, .ratio_multichannel_step6_over_t2only (Methods)
  compare: ["n_inputs", "n_heldout_and_mirror", "per_input_h", "card_hours", "ratio_multichannel_step6_over_t2only"]
