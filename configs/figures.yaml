# Display parameters of the paper's figures (not analysis parameters). Each value is what the published figure used.

pipeline:
  sagittal_x_mm: 2.0                  # the sagittal plane of the template figure (NMT v2 x, mm): every template-space thumbnail
  section_point_mm: [2.0, 19.5, 15.5] # the template figure's three sections; carried into the blockface template by the pull map, as the blockface template figure does
  blockface_level: 2                  # OME-Zarr level shown (0.16 mm in-plane)
  photo_section: 718                  # the photograph shown (the reconstruction figure's section)
  photo_box: 1.04                     # the photograph cropped to its brain box times this
  luminance_weights: [0.299, 0.587, 0.114]   # RGB -> gray (Rec. 601), for the photograph's side check
  soft_edge_px: [0.8, 1.5]            # the volume's tissue edge on black: Gaussian sigma and rounding (pixels at soft_edge_grid_mm), display only
  soft_edge_grid_mm: 0.16             # ... the reconstruction figure's pixel, rescaled to the completed volume's grid
  histology_mm_px: 0.034              # TIRL block grid (configuration.yml resolution)
  print_scale_range: [0.60, 0.25]     # the largest print scale (mm per tissue mm) in this range that fits the 178 mm width
  scale_bar_mm: 10

alignment_comparison:
  fov_mm: 20.0                        # panel b: the square crop (tissue mm)
  zoom: 1.4                           # panel b: print mm per tissue mm
  crop_height_pct: 50                 # panel b: the crop's center height = this percentile of the section's tissue (centered on it)
  difference_window_z: 2.0            # panel b: |difference| display window (z units), one for both routes

bf_template:
  nmt_sections_mm: [2.0, 19.5, 15.5]  # the sections (NMT v2 x, y, z mm): those of the MRI channels figure, carried through the link
  margin_mm: [1.0, 1.0, 1.0]          # black around the template's brain box (x, y, z), the 3D box the views are cut from
  post_mm: 4.0                        # ... and this much more behind the occipital pole
  fill_margin_mm: 0.5                 # each view: its own section's brain box + this
  colorbar_mm: 17.0                   # width reserved for the color bar, its ticks and its title

reconstruction:
  subject: MR252                      # MM2, the brain shown
  axial_z_mm: 30.12                   # (g) the axial plane (world mm): 1 mm above the fullest level, a clean outline (the author, 2 Oct)
  luminance_weights: [0.299, 0.587, 0.114]   # RGB -> luminance (Rec. 601)
  jump_half_mm: 6.0                   # (b) at most this far on either side of the camera jump
  step_half_mm: 6.0                   # (e) the half window around the brightness step
  print_scale_whole: 0.6              # print mm per tissue mm, whole-brain views (a, c, d, g): the house scale
  print_scale_zoom: 1.2               # print mm per tissue mm, zoomed views (b, e, f)
  plane_window_mm: 3.0                # (g) the crack-free plane is chosen within this distance
  soft_edge_f: [1.0, 3.0]             # (f) display edge: Gaussian sigma, rounding (pixels)
  soft_edge_g: [0.8, 1.5]             # (g) display edge: Gaussian sigma, rounding (pixels)

