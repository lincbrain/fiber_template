# nnU-Net 2.5.1, for the three blockface networks (models/blockface_segmentation.md): the 2D brain mask of each photograph
# (Dataset500) and the 3D brain mask and marker tubes (Dataset506, Dataset508), called by cli/linc-reconstruct through
# linc/blockface/external.py (set NNUNET_BIN to this environment's bin folder, LINC_MODELS to the weights). Ran on NVIDIA RTX 6000 Ada
# GPUs (CUDA 12.4, cuDNN 9.1; the torch wheels from PyPI).
# The analysis project's conda env `nnUNet`, exported with `conda env export --no-builds` on 22 Oct 2026 (python 3.9.20). Changes:
# the name, the prefix line, the export's duplicate explicit channel URL (https://conda.anaconda.org/conda-forge, the same as
# conda-forge: dropped so a site's channel alias applies), and seaborn moved out of the pip list. Three steps:
#     conda env create -f env/nnunet.yml && conda activate linc-nnunet
#     pip install --no-deps seaborn==0.13.2
#     patch -p1 -d "$CONDA_PREFIX/lib/python3.9/site-packages" < env/nnunetv2-2.5.1_record.patch
# - seaborn: the env of record is inconsistent by pip's metadata (pip check: seaborn 0.13.2 excludes numpy 1.24.0), so pip cannot
#   install the full list at once; seaborn (nnU-Net's training logger, imported at inference) goes in without its dependencies.
# - the patch: the env of record's nnunetv2 2.5.1 carried local edits, shipped as a patch (nnU-Net: Apache-2.0): the PNG reader
#   converts the images to float32 (on the 2D network's inference path); cropping.py drops an unused import that acvl_utils 0.2.1
#   lacks (without it nnUNetv2_predict fails to import); training only: one data-loader process setting and four trainer variants.
# Checked 22 Oct 2026 (built in a clean shell, PYTHONNOUSERSITE=1, PIP_USER=0, scratch caches): the same 115 distributions at the same
# versions as the env of record, nnunetv2 sources identical after the patch; the 2D brain-mask network on one MM1 photograph differs
# from the env of record by 14-16 of 4.6 million brain pixels, as two runs of the env of record differ from each other (14).
# (batchgenerators 0.25.1 and hiddenlayer 0.2 come from other builds of the same versions; they differ only in data-loader prints and
# threads and in plotting code, not on the inference path.)
