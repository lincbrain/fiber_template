# The main environment (3 Nov 2026: the former env/linc.yml, env/mri.yml and env/labels-interp.yml merged into one; the three
# roles tested after the merge: the MR257 registration and the MR252 label interpolation byte-identical, every numbers record and the
# MRI figures identical, the former linc.yml figures identical in data with matplotlib 3.11.1's text layout). What runs in it:
# - cli/linc-register (its linear stages, inputs, products and transform entries; the deformable engine runs in env/anatomix.yml),
#   cli/linc-mri, cli/linc-labels carry and cli/linc-labels interpolate (SimpleITK 2.5.3 demons), linc/evaluation;
# - the MRI channels' construction: MMORF 1.0.1 from the FSL conda channel (fsl-mmorf-cpu, fsl-mmorf-cuda), reproduce/templates;
# - the numbers records of reproduce/numbers and the figures of reproduce/figures (matplotlib 3.11.1), except the GPU ones of
#   env/deep.yml, env/anatomix.yml and env/tirl.yml (docs/paper_to_code.md lists each record's and figure's environment).
# The conda block is the MRI environment of record (python 3.11.16, numpy 2.4.6, scipy 1.17.1, nibabel 5.4.2) exported with
# `conda env export --no-builds`; the pip block holds what the runs of record imported from the account's user site-packages (zarr 3.1.5
# and its dependencies, matplotlib 3.11.1, pillow 12.3.0) plus the former linc.yml's extras (scikit-image, opencv, imageio, tifffile,
# networkx) and SimpleITK. Build and run with PYTHONNOUSERSITE=1, so that no user site-packages shadow this environment.
# External: FSL 6.0.7.4 (FLIRT, convert_xfm, dtifit; set FSLDIR), ANTs 2.5.4 (N4; set ANTSPATH). MMORF: run `mmorf_cuda` (or
# `mmorf_cpu`); the channel's `mmorf` wrapper expects an `fslpython` that is not in this environment.
#     conda env create -f env/linc.yml && conda activate linc && pip install -e . --no-deps
