# The deep-learning environment: the segmentation networks (code/shared/linc-segment, code/shared/segment) and the caudal completion
# (code/blockface/synthesis/linc-complete, code/blockface/synthesis), and the records and figures made with them. One file for both since 3 Nov 2026; until then it
# was env/completion.yml (environment name linc-completion), the file the records below name.
# Versions of record: python 3.11.13, torch 2.6.0+cu124 (CUDA 12.4, cuDNN 9.1), MONAI 1.4.0, numpy 1.26.4, scipy 1.16.2, nibabel 5.3.2,
# pillow 13.0.0, matplotlib 3.10.6; on NVIDIA RTX 6000 Ada GPUs.
# What ran here:
# - linc-segment: the four segmentation models (MRI brain mask; blockface photograph mask, 3D mask, marker tubes) were trained,
#   cross-validated and checked here (settings/models/README.md); linc-reconstruct and linc-register call it through
#   LINC_SEGMENT_PYTHON = this environment's python.
# - linc-complete: the four completion networks were trained, the completed volumes and the withheld-slab evaluation made, and the
#   d3_* records written here.
#   - d3_methods and d3_predicted_share (CPU only) regenerate identically here and in linc.yml.
#   - d3_domain_shift and d3_domain_shift_prod run the network on the GPU: identical here on the same GPU model; other library versions
#     or GPUs can change the last digits.
# - The figures of the completion and of the LGN/STN error budget (code/figures/s_synthesis_depth, s_synthesis_gallery,
#   s_lgnstn) were drawn here: matplotlib and its dependencies at the versions of record render them pixel-identical to the paper's.
#     conda env create -f settings/env/deep.yml && conda activate linc-deep && pip install -e . --no-deps
# --no-deps: the package's unpinned core dependencies (zarr -> numcodecs) would upgrade numpy to 2.x, against MONAI 1.4.0's
# numpy<2 and the env of record (numpy 1.26.4); blockface.synthesis and shared.segment do not use zarr.
name: linc-deep
channels: [conda-forge]
dependencies:
  - python=3.11.13
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - monai==1.4.0
      - numpy==1.26.4
      - scipy==1.16.2
      - scikit-image==0.25.2
      - nibabel==5.3.2
      - pyyaml==6.0.2
      # the figures (matplotlib's own dependencies, at the versions of record; pillow as validated)
      - matplotlib==3.10.6
      - contourpy==1.3.3
      - cycler==0.12.1
      - fonttools==4.60.0
      - kiwisolver==1.4.9
      - pyparsing==3.2.4
      - python-dateutil==2.9.0.post0
      - six==1.17.0
      - pillow==13.0.0
