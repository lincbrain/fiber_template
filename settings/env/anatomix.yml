# The feature-based deformable registration engine of every registration of record (code/blockface/registration/featurereg.py runs it
# through code/blockface/registration/anatomix_runner.py; set ANATOMIX_PYTHON to this environment's python). Ran on NVIDIA RTX 4000 Ada,
# RTX 6000 Ada and RTX 3090 GPUs (CUDA 12.6, cuDNN 9.10): bit-exact on the GPU model of a record; on another model a result can
# differ by floating point (tests/README.md). The pip list below is what the engine imported in a registration of
# record (traced), at the versions imported; built from this file it reproduces that registration bit for bit.
# The engine is not on PyPI at these versions: anatomix from its repository at a pinned commit, and the FireANTs fork bundled in it,
# both installed editable, without FireANTs' fused CUDA ops (the runs of record used --fused-ops off):
#     conda env create -f settings/env/anatomix.yml && conda activate linc-anatomix
#     git clone https://github.com/neel-dey/anatomix.git anatomix && git -C anatomix checkout 4c86aeeca5e4bf712d9e5775a01fadb37b30c13a
#     pip install --no-deps -e anatomix
#     B=anatomix/anatomix/registration/registration_backend
#     git clone https://github.com/neel-dey/FireANTs $B/fireants && git -C $B/fireants checkout 21ae072
#     pip install --no-deps -e $B/fireants          # installs as fireants 1.5.1
# The backbone weights (anatomix-dev-vit.pth) are fetched from huggingface.co/neeldey/anatomix on first use; the registrations of
# record used revision 842cfe93e634ade096cc6a6bb14309a760c2a8cc, sha256 62c7be4b14da7dcc574b90696bf35569f5aa100de6221bb46498f5d580b451ac.
name: linc-anatomix
channels: [conda-forge]
dependencies:
  - python=3.11.15
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.13.0+cu126
      - torchvision==0.28.0+cu126
      - numpy==2.4.6
      - scipy==1.17.1
      - nibabel==5.4.2
      - simpleitk==2.5.6
      - scikit-image==0.26.0
      - monai==1.6.0
      - torchio==1.2.1
      - einops==0.8.2
      - timm==1.0.22
      - huggingface_hub==1.27.0
      - safetensors==0.8.0
      - pyyaml==6.0.3
      - tqdm==4.70.0
      - matplotlib==3.11.1
      # the other packages the engine imported at run time (traced in a registration of record, 22 Oct 2026), at those
      # versions: a fresh resolve misses some of them (scikit-learn, pandas, h5py, ...) and picks newer versions of others
      - absl-py==2.5.0
      - anyio==4.14.2
      - certifi==2026.7.22
      - charset-normalizer==3.5.1
      - click==8.4.2
      - cuda-bindings==12.9.7
      - cuda-pathfinder==1.6.0
      - cycler==0.12.1
      - dynamic-network-architectures==0.4.4
      - filelock==3.32.3
      - fonttools==4.63.0
      - fsspec==2026.7.0
      - h11==0.16.0
      - h5py==3.16.0
      - httpcore==1.0.9
      - httpx==0.28.1
      - idna==3.18
      - joblib==1.5.3
      - kiwisolver==1.5.0
      - lazy-loader==0.5
      - mpmath==1.3.0
      - pandas==3.0.5
      - pillow==12.3.0
      - protobuf==7.35.1
      - pyparsing==3.3.2
      - requests==2.34.2
      - rich==15.0.0
      - scikit-learn==1.8.0
      - setuptools==84.0.0
      - sympy==1.14.0
      - tensorboard==2.21.0
      - threadpoolctl==3.6.0
      - tifffile==2026.3.3
      - triton==3.7.1
      - typing-extensions==4.16.0
      - urllib3==2.7.0
      # imported at run time from the account's user site-packages (~/.local/lib/python3.11) by the registrations of record,
      # pinned at those versions (run with PYTHONNOUSERSITE=1 to avoid the shadowing)
      - cython==3.2.4
      - donfig==0.8.1.post1
      - google-crc32c==1.8.0
      - numcodecs==0.16.5
      - packaging==26.0
      - psutil==7.2.2
      - pygments==2.19.2
      - python-dateutil==2.9.0.post0
      - six==1.17.0
      - zarr==3.1.5
