# The blockface template's construction: which brains, on which grids, with which MMORF schedule. The build reads its brains, grids
# and parameters from this file (code/template/build_blockface_template.py, code/template/blockface_build.py and
# blockface_mmorf.py); the values below are those of the template of record (code/template/README.txt).

members:
  with_mri: [MF275, MF278, MF282, MR243, MR249, MR250, MR251, MR252, MR253, MR254, MR256, MR257, MR261]   # b0 channel: their own b0
  without_mri: [MF191, MF196, MF204, MR244, MR247, MR248, MR263, MR273]   # b0 channel: the stand-in b0 (template b0 aligned)
  mirrors: true                    # each brain is used twice, as cut and mirrored left-right, so the template is symmetric
  template_member: TPL             # the MRI template's b0, b0 channel only (not in the blockface average)

grids:
  prep_frame_grow_mm: 8.0          # the members are prepared on the MRI template's frame grown by this, so none can be clipped
  build_frame: {pad_mm: 4.0, multiple_vox: 4}   # the members' union + pad_mm, x-symmetric, size a multiple of this
  plan_a_voxel_mm: 0.5             # the grid of the first seven nonlinear steps
  step8_voxel_mm: 0.25             # step 8's grid: the first grid's exact 2x lattice
  step8_box: {pad_mm: 4.0, threshold: 0.01}   # step 8's box: the support after step 7 (> threshold x p99) + pad
  native_mm: {BF: 0.25, B0: 0.5}   # each channel's own resolution: step 8's smoothing floors

mmorf:
  lambda_scale: 10.0               # multiplies every bending-energy weight but the first (near-rigid) level
  # batch = MMORF tasks at a time on one 48 GB card, scheduling only (the record ran the same tasks on three cards: 24 and 12 at a time)
  plan_a: {steps: 7, iterations: 3, batch: 8}   # 7 nonlinear steps x 3 template iterations
  step8: {step: 8, iterations: 3, batch: 4}     # the eighth step alone, from the state after step 7
  warp_res_init_mm: 16             # knot spacing of the coarsest level
  # per-level ladders (level count = step + 1), as strings: they are written into MMORF's .ini files verbatim
  ladders:
    7:
      warp_scaling: ["1", "1", "1", "2", "2", "2", "2", "2"]
      lambda_reg: ["4.0e5", "3.7e-1", "3.1e-1", "2.6e-1", "2.2e-1", "1.8e-1", "1.5e-1", "1.2e-1"]
      fwhm_mm: ["4.0", "2.0", "1.0", "0.5", "0.25", "0.125", "0.0625", "0.05"]
    8:
      warp_scaling: ["1", "1", "1", "2", "2", "2", "2", "2", "2"]
      lambda_reg: ["4.0e5", "3.7e-1", "3.1e-1", "2.6e-1", "2.2e-1", "1.8e-1", "1.5e-1", "1.2e-1", "1.0e-1"]
      fwhm_mm: ["4.0", "2.0", "1.0", "0.5", "0.25", "0.125", "0.0625", "0.05", "0.05"]
