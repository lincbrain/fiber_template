# Display parameters of the paper's figures (not analysis parameters). Each value is what the published figure used.

pipeline:
  sagittal_x_mm: 2.0                  # the sagittal plane of the template figure (NMT v2 x, mm): every template-space thumbnail
  section_point_mm: [2.0, 19.5, 15.5] # the template figure's three sections; carried into the blockface template by the pull map, as the blockface template figure does
  blockface_level: 2                  # OME-Zarr level of the photograph's side check (0.16 mm in-plane)
  photo_section: 654                  # the photograph shown: the example's section at MM2's place along its stack (MM2's section 718)
  photo_box: 1.04                     # the photograph cropped to its brain box times this
  luminance_weights: [0.299, 0.587, 0.114]   # RGB -> gray (Rec. 601), for the photograph's side check
  blockface_x_mm: 4.5                 # the blockface volume's sagittal plane: lateral of the medial occipital cortex, which a plane
                                      #   near the midline cuts at a tangent
  blockface_hires_level: 2            # the store's pyramid level of its photographed part (0.16 mm in plane, every 45 um section)
  hires_points_per_voxel: 3           # display points per 0.25 mm voxel (0.083 mm), placed symmetrically inside each voxel
  record_color_pct: 99.0              # the record's color scale: this percentile of the brightest channel of the registered colors
  junction_depth_mm: 0.40             # a border vertex lies on the junction plane if the voxels across it are within this
  histology_mm_px: 0.034              # TIRL block grid (configuration.yml resolution)
  histology_photo_slice: 704          # the histology example's photograph (MM2's store, level 0): its gray is TIRL's fixed image
  print_scale_range: [0.60, 0.25]     # the largest print scale (mm per tissue mm) in this range that fits the 178 mm width
  max_height_mm: 138                  # ... lowered in 0.01 steps while the figure is taller (it must fit a page with its caption)
  scale_bar_mm: 10

alignment_comparison:
  fov_mm: 20.0                        # panel b: the square crop (tissue mm)
  zoom: 1.4                           # panel b: print mm per tissue mm
  crop_height_pct: 50                 # panel b: the crop's center height = this percentile of the section's tissue (centered on it)
  difference_window_z: 2.0            # panel b: |difference| display window (z units), one for both routes

link:                                 # Fig. 6 (link.py); its command-line options override these
  layout: 2x3                         # rows sagittal and coronal; columns the T2, the blockface template, the distance map (3x2: the earlier layout)
  wm_line: t2                         # the orange line: the T2's two-class gray/white split (fa: the white matter's boundary, FA = 0.25)
  fa_smooth: 0.0                      # wm_line fa: Gaussian sigma (voxels) of the FA on the plane

bf_template:
  nmt_sections_mm: [2.0, 19.5, 15.5]  # the sections (NMT v2 x, y, z mm): those of the MRI channels figure, carried through the link
  margin_mm: [1.0, 1.0, 1.0]          # black around the template's brain box (x, y, z), the 3D box the views are cut from
  post_mm: 4.0                        # ... and this much more behind the occipital pole
  fill_margin_mm: 0.5                 # each view: its own section's brain box + this
  max_height_mm: 185                  # the page's 231 mm text height less the caption and the float's spacing

reconstruction:
  subject: MR252                      # MM2, the brain shown
  axial_z_mm: 30.12                   # (g) the axial plane (world mm): 1 mm above the fullest level, a clean outline (the author, 2 Oct)
  luminance_weights: [0.299, 0.587, 0.114]   # RGB -> luminance (Rec. 601)
  jump_shown: [494, 495]             # (b) the camera jump shown (the largest step of the 2D-mask centroid; reconstruction.py checks it);
                                      #   paper_numbers/bf_jump_pullback.py registers it again for the panel's "Aligned"
  jump_half_mm: 8.0                   # (b) the sections read on either side of the camera jump (mm); the panel shows as many as (e)'s width lets
  step_half_mm: 6.0                   # (e) the half window around the brightness step
  print_scale_whole: 0.6              # print mm per tissue mm, whole-brain views (a, c, d, g), before the factor that fills the page
  print_scale_zoom: 1.2               # print mm per tissue mm, zoomed views (b, e, f)
  max_height_mm: 185                  # the page's 231 mm text height less the caption and the float's spacing
  plane_window_mm: 3.0                # (g) the crack-free plane is chosen within this distance
  soft_edge_f: [1.0, 3.0]             # (f) display edge: Gaussian sigma, rounding (pixels)
  soft_edge_g: [0.8, 1.5]             # (g) display edge: Gaussian sigma, rounding (pixels)

synthesis_gallery:
  frame: canonical                    # each brain's canonical fine grid (the run-113 world, its rigid placement): one world plane for all 21
  view: axial                         # one world axial plane for all 21, from the caudal end to 22 mm rostral of the junction
  z_mm: 9.15                          # that plane (the author's choice, 11 Nov 2026, 20:5x): $LINC_NUMBERS/gallery_plane_2026-11.json's
                                      #   rule (the fewest mask gaps, one-sided missing pieces and cerebellum at the junction)
  x_mm: 4.5                           # --view sagittal only: right of the midline, as Fig. 2's blockface volume
  ncol: 7                             # 3 rows x 7 tiles
  letters: true                       # orientation letters once (L/R beside the first row, A/P above and below its first tile)
  plane: record                       # the axial options only (--frame flat): record | fewest_gaps

networks:
  standin: MR247                      # Supplementary S4 row (f): MM12, chosen by eye among the eight brains without MRI for a natural occipital
                                      #   pole in its stand-in b0 (the author, 12 Nov 2026; MF8's looked flat there)
  max_height_mm: 203                  # the figure's height at most: its page with its caption

tracer_sections3d:
  cases: [MR243, MR252, MR256, MF191]      # the paper's tracer figure: (a) MM1, MM2, MM3 beside MF8 alone, (b) all four; before
  views: [[MR243, MR252, MR256], [MF191]]  #   12 Nov 2026 MM1, MF8, MM2 in one view (cases [MR243, MF191, MR252], no views, record
  arrange: side                            #   fig_tracer_sections3d_v6_h9); other layouts: cases [MR243, MR252, MR256] alone, or
  record: fig_tracer_sections3d_v6{tag}_c  #   arrange: stack
histology:
  panels: [a, b]                           # the panels drawn (the author, 12 Nov 2026: (c) and (d) left out; the text gives their numbers);
                                           #   empty: all four
  panel_a_piece: mr256LY_c02_s18nDF_0000   # panel (a)'s section (MM3): an intact one, as shown until 12 Nov 2026 (the author: the piece the
                                           #   median rule picks on the registrations with the per-component stiffness, s28, has a torn cortex);
                                           #   empty: the MM3 piece whose nonlinear tissue Dice is closest to MM3's median
  panel_b_pieces:                          # panel (b)'s tiles by quantile: a listed quantile shows that piece (a found piece within 3 ranks of
    90: mf275FR_c04_s07nDF_0002            #   the quantile); the others the found piece whose offset is closest to it. The 90th: the author,
                                           #   12 Nov 2026 (the closest piece's hole is barely visible and its window has a gap)

bf2mri_steps:                              # Supplementary: the blockface registered to its own MRI, step by step
  subject: MR243                           # MM1 (the author, 12 Nov 2026: MM2's b0 has zigzag artifacts in the ventricles)
  variant: r1v3                            # its registration of record (FLIRT 9 dof, the cut, the deformable step)
  x_mm: 4.25                               # the sagittal plane (b0 frame): a voxel plane of both grids, 0.5 and 0.25 mm
