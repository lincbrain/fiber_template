# Parameters of the blockface reconstruction (Methods, "Blockface reconstruction"; Fig. 3). Read by code/blockface/ and
# code/blockface/linc-reconstruct. Per-brain inputs (spacing, camera jumps, missing sections, caudal cutoff, masks of record) are in
# settings/brains/<ID>.yaml. Values as used for the paper (the analysis project's code/config.py).

# Steps 1, 4 and 6: the networks that segment the photographs, the brain and the marker tubes (settings/models/README.md;
# code/shared/linc-segment, weights in $LINC_MODELS/segment/<model>/). linc-reconstruct runs them with --postprocess none and applies each
# task's post-processing once (code/blockface/mask_rules.py: photos fill_photo_mask, mask largest_cc_fill, tubes tube_rule).
segmentation:
  models: {photos: bf_mask2d, mask: bf_mask3d, tubes: bf_holes}

# Step 2: the camera jumps, each corrected by a 2D TIRL registration of the photographs on either side of it (rotation ->
# rigid -> affine), composed over the stack.
camera_jumps:
  tirl_parameters: settings/tirl/camera_jumps.yml   # TIRL `linc.h2b` script parameters (paths are filled in per jump)

# Steps 4 and 6: the 3D networks' inputs and post-processing, on the 0.40 mm section grid, at in-plane level L4.
volume_segmentation:
  tubes_min_voxels: 3                # tube components smaller than this are dropped (specks)
  tubes_left_tolerance_vox: 3.0      # tubes are kept only left of the brain's x-centroid + this tolerance (drilled on the left)

# The reconstruction itself (code/blockface/reconstruct.py), at in-plane level L1 and the native section step.
reconstruction:
  level: 1                           # in-plane pyramid level of the final volume (L1 = /2 of the photographs)
  view_level: 2                      # a viewable RGB NIfTI is also written at this level
  curation_z_target_um: 400.0        # the hand-edit grid's section step (curation_f native sections per curated slice)
  harmonize_mm: 1.0                  # brightness steps: the de-stepped reference is smoothed over this width (sigma, mm)
  crop_margin_mm: 2.0                # margin around the brain before the tight crop
  crop_multiple: 16                  # the tight crop's in-plane size is a multiple of this at L4
  gain_clip: [0.4, 2.5]              # per-section, per-channel gain clamp
  w_lum: [0.299, 0.587, 0.114]       # RGB -> luminance (Rec. 601)
  orient_corr_min: 0.90              # minimum correlation accepted when matching the rebuilt background to its reference
  zref: {coarse_mm: 0.64, sigma_mm: 3.84, window_mm: 0.40}   # the z-referenced illumination field of a brain with shading:
                                     # poly2+zref (MR263): estimated on ~coarse_mm blocks, smoothed to sigma_mm, referenced to the
                                     # sections within +/- window_mm (only its departure from them is divided out)
  demons:                            # registration-based interpolation of missing sections (multi-resolution demons)
    shrink: [4, 2, 1]
    sigma: [2, 1, 0]
    iters: 200
    dev: 1.5
    dilate: 15
  tube_inpainting:                   # the marker tubes: grown by their dark halo, filled by a biharmonic solve at L4, feathered in
    dilate: 2
    margin: 12
    halo_frac: 0.88
    feather_band: 3
