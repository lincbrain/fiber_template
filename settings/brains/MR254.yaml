# MR254: the per-brain inputs of its blockface reconstruction, as used for the paper (from the analysis project's
# code/config.py + code/macaque_datasets.xlsx). Hand inputs: spacing (vx, vz um), camera jumps, missing sections and the
# caudal cutoff (see code/blockface/subject.py). `raw` is relative to $LINC_RAW.
# registration_to_own_mri: the inputs of record of the registration to the brain's own b0 (R1 v3): the b0 mask (paths relative to
# mri/), the fixed b0, and the start pose (world, blockface -> b0 on the template grid), recovered from the run's saved init matrix.
subject: MR254
raw: blockface_curated/MR254
raw_glob: '*.JPG'
raw_regex: Img(\d+)\.JPG
idx_range: [17458, 18867]
reduce: mean
rotate180: true
vx: 20.0
vz: 45.0
jumps:
- [627, 628]
- [687, 688]
- [794, 795]
- [916, 917]
- [1069, 1070]
missing:
- [194, 196]
- [196, 198]
- [204, 206]
- [763, 765]
- [768, 770]
- [1379, -1]
histo_vx: 0.0
histo_vz: 0.0
ccs: 0
cce: 0
mri: dwi_b0_las_brain_debiased_canonical.nii.gz
stack_pad: 0
jump_mode: affine
# reconstruction_mask: the volume of record was reconstructed with this earlier brain mask, and the mask was then edited by hand
# without reconstructing again (6,177 voxels of the hand-edit grid removed, in 133 of its 173 sections): the image was only cleared
# where tissue was removed. So the pixels (shading, brightness steps, color reference, tube fill) follow this mask, and the
# final mask (curated/MR254_mask_edited) gives the mask and tubes finals and clears the image where it removed tissue.
reconstruction_mask: curated/MR254_mask_edited_pre_2026-10-03.nii.gz
# reconstruction_spacing_um: the pixel size and section step the volume was REBUILT at (its pixels depend on them, e.g. the
# intensity smoothing width in sections); vx/vz above are the calibrated spacing written into the headers afterwards by a
# header-only rescaling about the world origin (code/blockface/spacing.py; pixels unchanged). Equal for a new brain.
# curation_f: native sections per curated (0.40 mm) slice of the hand-edit grid, pinned at the reconstruction spacing.
reconstruction_spacing_um: {vx: 20, vz: 50}
curation_f: 8
registration_to_own_mri:
  variant_of_record: r1v3mr
  b0_mask: MR254_mri_mask_r1pair_reg_2026-10-03.nii.gz
  b0_mask_source: register-derived pair mask (D31)
  fixed_b0: MR254_mri.nii.gz
  start_pose_world:
  - [0.9950464535557217, 0.015166716134934453, 0.09824726962040033, -40.13159482861453]
  - [-0.025458595174783372, 0.9942132032753669, 0.10436458386186619, -31.85096608979983]
  - [-0.09609586462438335, -0.106348846512862, 0.9896744452836378, -19.93593984053594]
  - [0.0, 0.0, 0.0, 1.0]
# masks_of_record: the masks this brain's reconstruction of record used, and which of them were corrected by hand (paths
# relative to sub-<ID>/blockface/). A hand-edited curated file wins over the 3D models' outputs in linc-reconstruct.
masks_of_record:
  photo_masks_2d:
    folder: 01_brainmask/01_final
    hand_edited: false
    note: the 2D model's output, unchanged
  brain_mask_3d:
    file: curated/MR254_mask_edited.nii.gz
    hand_edited: true
  tubes_3d:
    file: curated/MR254_holes_edited.nii.gz
    hand_edited: true
