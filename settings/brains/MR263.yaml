# MR263: the per-brain inputs of its blockface reconstruction, as used for the paper (from the analysis project's
# code/config.py + code/macaque_datasets.xlsx). Manual inputs: spacing (vx, vz um), camera jumps, missing sections and the
# caudal cutoff (see code/blockface/subject.py). `raw` is relative to $LINC_RAW.
subject: MR263
raw: blockface_curated/MR263
raw_glob: '*.JPG'
raw_regex: Img(\d+)\.JPG
idx_range: [33056, 34456]
reduce: mean
rotate180: true
