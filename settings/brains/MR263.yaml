mri: ''
stack_pad: 0
jump_mode: affine
# reconstruction_spacing_um: the pixel size and section step the volume was REBUILT at (its pixels depend on them, e.g. the
# intensity smoothing width in sections); vx/vz above are the calibrated spacing written into the headers afterwards by a
# header-only rescaling about the world origin (code/blockface/spacing.py; pixels unchanged). Equal for a new brain.
# curation_f: native sections per curated (0.40 mm) slice of the manual-edit grid, pinned at the reconstruction spacing.
reconstruction_spacing_um: {vx: 20, vz: 50}
# shading: the illumination correction of the reconstruction: poly2 (the default, every other brain) or poly2+zref (the
# per-section degree-2 field, then the z-referenced field of settings/blockface.yaml reconstruction.zref): MR263's record was
# made with poly2+zref (the author's request, 25 Sep 2026; the analysis project's _nightlogs/L1_MR263_zref7d.log).
shading: poly2+zref
curation_f: 8
# native_end_crop_mm: this brain's own last photographed sections are darker, so the product steps drop the last
# round(mm / vz) of them before resampling (the analysis project's synthesis/v2/native_crop*.json). Read by the registration
# to the brain's own MRI (its products) and by the blockface template's member preparation; the direct routes did not apply it.
native_end_crop_mm: 3.5
# masks_of_record: the masks this brain's reconstruction of record used, and which of them were manually corrected (paths
# relative to sub-<ID>/blockface/). A manually edited curated file wins over the 3D models' outputs in linc-reconstruct.
masks_of_record:
  photo_masks_2d:
    folder: 01_brainmask/01_final
    manually_edited: false
    note: the 2D model's output, unchanged
  brain_mask_3d:
    file: curated/MR263_mask_edited.nii.gz
    manually_edited: true
  tubes_3d:
    file: curated/MR263_holes_edited.nii.gz
    manually_edited: true
