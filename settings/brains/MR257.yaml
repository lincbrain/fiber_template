# MR257: the per-brain inputs of its blockface reconstruction, as used for the paper (from the analysis project's
# code/config.py + code/macaque_datasets.xlsx). Hand inputs: spacing (vx, vz um), camera jumps, missing sections and the
# caudal cutoff (see code/blockface/subject.py). `raw` is relative to $LINC_RAW.
# registration_to_own_mri: the inputs of record of the registration to the brain's own b0 (R1 v3): the b0 mask (paths relative to
# mri/), the fixed b0, and the start pose (world, blockface -> b0 on the template grid), recovered from the run's saved init matrix.
subject: MR257
raw: blockface_curated/MR257
raw_glob: '*.JPG'
raw_regex: Img(\d+)\.JPG
idx_range: [21521, 22840]
reduce: mean
rotate180: true
vx: 20.0
vz: 45.0
jumps:
- [655, 656]
- [865, 866]
- [1009, 1010]
- [1088, 1089]
missing:
- [0, 4]
- [10, 12]
- [723, 725]
- [925, 927]
- [991, 993]
histo_vx: 0.0
histo_vz: 0.0
ccs: 0
cce: 0
mri: ''
stack_pad: 0
jump_mode: affine
# reconstruction_spacing_um: the pixel size and section step the volume was REBUILT at (its pixels depend on them, e.g. the
# intensity smoothing width in sections); vx/vz above are the calibrated spacing written into the headers afterwards by a
# header-only rescaling about the world origin (code/blockface/spacing.py; pixels unchanged). Equal for a new brain.
# curation_f: native sections per curated (0.40 mm) slice of the hand-edit grid, pinned at the reconstruction spacing.
reconstruction_spacing_um: {vx: 20, vz: 50}
curation_f: 8
registration_to_own_mri:
  variant_of_record: r1v3m
  b0_mask: MR257_mri_mask.nii.gz
  b0_mask_source: frame (the edit swapped in on 3 Oct 2026)
  fixed_b0: MR257_mri.nii.gz
  start_pose_world:
  - [0.9994720455017287, 0.019927691441654655, 0.02566159337211593, -46.078640006080434]
  - [-0.018970021598793168, 0.999133830172633, -0.03703684226692567, -26.936526383959276]
  - [-0.026377424838883366, 0.036530487518920664, 0.9989843617096811, -24.976517810131714]
  - [0.0, 0.0, 0.0, 1.0]
# masks_of_record: the masks this brain's reconstruction of record used, and which of them were corrected by hand (paths
# relative to sub-<ID>/blockface/). A hand-edited curated file wins over the 3D models' outputs in linc-reconstruct.
masks_of_record:
  photo_masks_2d:
    folder: 01_brainmask/01_final
    hand_edited: false
    note: the 2D model's output, unchanged
  brain_mask_3d:
    file: curated/MR257_mask_edited.nii.gz
    hand_edited: true
  tubes_3d:
    file: curated/MR257_holes_edited.nii.gz
    hand_edited: true
