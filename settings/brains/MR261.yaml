# MR261: the per-brain inputs of its blockface reconstruction, as used for the paper (from the analysis project's
# code/config.py + code/macaque_datasets.xlsx). Hand inputs: spacing (vx, vz um), camera jumps, missing sections and the
# caudal cutoff (see code/blockface/subject.py). `raw` is relative to $LINC_RAW.
# registration_to_own_mri: the inputs of record of the registration to the brain's own b0 (R1 v3): the b0 mask (paths relative to
# mri/), the fixed b0, and the start pose (world, blockface -> b0 on the template grid), recovered from the run's saved init matrix.
subject: MR261
raw: blockface_curated/MR261
raw_glob: '*.JPG'
raw_regex: Img(\d+)\.JPG
idx_range: [30274, 31656]
reduce: mean
rotate180: false
vx: 20
vz: 45
jumps:
- [481, 482]
- [886, 887]
- [1030, 1031]
missing:
- [43, 45]
- [158, 161]
- [654, 656]
- [810, 812]
