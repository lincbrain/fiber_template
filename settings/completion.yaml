# Caudal completion: the network that predicts the blockface tissue a brain's photographs lack, from its b0 image, and the join
# with the photographs (paper Methods, "Registration to the brain's own MRI and caudal completion"; the network:
# Gonzales et al. 2026, ISBI, "Completing unphotographed blockface ...").
# The values are those of the networks and the completed volumes of record. Read by code/blockface/synthesis and code/figures/paper_numbers/d3_*.py.

# --- grids ---
input_mm: 0.5                    # the b0 on its frame grid ("coarse" box)
output_mm: 0.25                  # the input box's center-aligned 2x refinement: output voxel 2k sits on input voxel k

# --- network (the architecture is fixed in code/blockface/synthesis/network.py; these are the sizes of record) ---
features: [32, 32, 64, 128, 256, 32]   # MONAI BasicUNet feature counts at the input grid
head: 32                         # channels of the x2 head and the two refinement blocks at the output grid

# --- network input ---
input_percentiles: [0.5, 99.5]   # own b0: x = clip((b0 - p0.5) / (p99.5 - p0.5), 0, 1) inside the completion brain, 0 outside
stand_in_lo: 0.0                 # stand-in b0 (brains without MRI): lower limit fixed at 0, x = clip(b0 / p99.5, 0, 1); the scaling the
                                 # stand-in network was trained with (its 13 training inputs all had p0.5 = 0)

# --- prediction (sliding window) ---
window: 64                       # input voxels per window side (32 mm); output windows 128^3
overlap: 0.5
blend: gaussian
window_batch: 1

# --- join with the photographs (Methods: "Before joining, the prediction's intensity was matched to the photographs, and the two
#     were cross-faded over 2 mm") ---
recal_mm: 8.0                    # one isotonic (PAVA) map prediction -> photographs, fitted on the first 8 mm of retained tissue
                                 #   rostral of the cut, fully photographed voxels only
fully_photographed: 0.999        # "fully photographed" = photo fraction >= 0.999 (the map's band and the scored slab voxels)
pava_bins: 64                    #   on 64 quantile bins of the prediction
fade_mm: 2.0                     # cosine cross-fade: w = 0.5 - 0.5 cos(pi * clip(d / 2 mm, 0, 1)), d = mm rostral of the cut

# --- the join plane: the clean cut face, one plane per brain, parallel to the photographed sections (Methods: "from which the
#     photographs were complete over the next 40 mm") ---
clean_face:
  tau: 0.95                      # a plane is complete when the photographs cover >= 95 % of the brain mask eroded by erode_mm
  erode_mm: 1.0
  window_mm: 40.0                # z_c = the most caudal plane from which every plane over the next 40 mm is complete
  margin_mm: 1.5                 # z_f = z_c + 1.5 mm (the cut; everything caudal of it is predicted)

# --- training (the recipe of the networks of record) ---
training:
  epochs: 80
  patches_per_epoch: 500
  batch: 2
  lr: 2.0e-4                     # Adam; linear warm-up over 5 epochs, then cosine decay
  warmup: 5
  ema_decay: 0.999               # the released weights are the exponential moving average
  clip: 1.0                      # gradient-norm clipping
  w_l1: 1.0                      # loss = l1 + 0.2 gradient-l1 + 0.6 (1 - multi-scale SSIM), masked to the training targets
  w_grad: 0.2
  w_ssim: 0.6
  ms_ssim_weights: [0.5, 0.3, 0.2]
  photographed_only: 0.5         # targets: photographed voxels, minus those whose photographed share is < 0.5
  valid_trim_mm: 0.25            # targets: minus each anterior-posterior column's caudal-most 0.25 mm of photographed tissue
  patch_stride: 6                # patch centers: every 6th target voxel
  num_workers: 8
  augment:                       # one physical-space transform per sample, applied to input and target alike
    rot: 0.17                    # rad, about each axis
    scale: 0.12                  # per-axis scale
    trans_mm: 0.7
    elastic_mm: 0.42             # smooth field on an 8^3 lattice over the patch
    intens: true                 # input only: contrast 0.15, brightness 0.1, bias field 0.15, noise 0.05
  intensity: {contrast: 0.15, brightness: 0.1, noise: 0.05, bias: 0.15}
  # Specimen IDs (paper names): the 12 brains with MRI of the withheld-slab evaluation, MF278 (MF5), MF282 (MF7), MR243 (MM1),
  # MR249 (MM4), MR250 (MM5), MR251 (MM6), MR252 (MM2), MR253 (MM7), MR254 (MM8), MR256 (MM3), MR257 (MM9), MR261 (MM10)
  members: [MF278, MF282, MR243, MR249, MR250, MR251, MR252, MR253, MR254, MR256, MR257, MR261]
  extra_train: [MF275]           # MF6: trained in every protocol, never held out (it joined the training set after the evaluation design)
  # the networks of record, each on these 13 brains, seed 0: the b0 they read, the protocol (full: all photographed tissue rostral of the
  # junction plane; lso: also without a withheld slab, for the evaluation), and the training time and GPU of the run of record
  runs_of_record:
    d3_full_A_s0: {input: own b0, protocol: full, hours: 0.93, gpu: NVIDIA RTX 6000 Ada Generation}
    d3p_full_A_s0: {input: stand-in b0, protocol: full, hours: 0.93, gpu: NVIDIA RTX 6000 Ada Generation}
    d3_lso_A_s0: {input: own b0, protocol: lso, hours: 1.54, gpu: NVIDIA RTX 3090}
    d3p_lso_A_s0: {input: stand-in b0, protocol: lso, hours: 0.93, gpu: NVIDIA RTX 6000 Ada Generation}

# --- the prepared folder of a brain (code/blockface/synthesis/prepare.py: `linc-complete prepare --subject <ID> --out DIR`) ---
prepare:
  crop_mm: 3.0                   # the working grid: the b0 frame cropped to the brain with this margin
  pad_mm: 4.0                    # zero padding that keeps the brain at least this far from the grid's edge
  flat_pad_mm: 4.0               # the same on the grid rotated so that the sections lie flat
  flat_multiple: 16              # that grid's sizes are multiples of this
  support_threshold: 0.5         # a voxel counts as photographed when at least this fraction of its pulled support is
  bf_percentiles: [1.0, 99.0]    # the photographs' grey over the photographed tissue
  rgb_percentile: 99.0           # the color's one scale: this percentile of the brightest channel
  bf_level: 1                    # the blockface store's level whose geometry the photographed fraction is computed on
  normal_decimals: 4             # the section normal as seam.json records it
  # Tissue only the MRI shows, detected for a new brain (the paper's brains have it in their register: this detector, plus manual trims):
  # brain voxels without photographs, within the photographed extent, opened by a ball to drop the thin surface shell and fissures
  trim:
    open_mm: 1.0                 # the ball's radius
    min_ml: 0.1                  # components at least this large
    touch_mm: 20.0               # that begin within this distance of the photographed end
    max_height: 0.5              # whose centroid lies in the lower part of the brain, so that only the brainstem is trimmed, not the cortex at the cut
    foot_mm: 2.0                 # the caudal continuation: unphotographed brain below this much of the component's caudal end
    frame_min_vox: 20            # on the b0 frame, detached fragments smaller than this are dropped
  # Each brain's inputs, as path templates: {ID}, {mri} = $LINC_DATA/sub-<ID>/mri, {nonlin} = the nonlin folder, {work} = $LINC_WORK.
  # nonlin: the registration's products on its 0.25 mm grid; matrix: its linear start; brain_mask: the brain on the b0 frame;
  # register: labels on the frame, label 1 = tissue the MRI shows and the photographs lack; stand_in_b0: a brain without MRI.
  inputs:
    new_brain:                   # a brain with MRI, registered by `linc-register mri`
      nonlin: "{work}/register/{ID}"
      matrix: "{nonlin}/linear/{ID}_bf2mri_dof9.mat"
      brain_mask: "{mri}/{ID}_mri_mask.nii.gz"
      detect_trim: true
    new_brain_stand_in:          # a brain without MRI, registered by `linc-register direct-placement`, which writes mri/stand_in/
      nonlin: "{mri}/stand_in"
      matrix: "{mri}/stand_in/{ID}_bf2mri_dof9.mat"
      brain_mask: "{mri}/stand_in/{ID}_pseudo_brain_n1_0p5.nii.gz"
      stand_in_b0: "{mri}/stand_in/{ID}_mri_full.nii.gz"
    of_record:                   # the paper's 21 brains: `prepare` rebuilds each of their folders of record exactly
      - brains: [MF275, MF282, MR243, MR250, MR251, MR253]
        nonlin: "{mri}/nonlinear_r1v3"
        matrix: "{mri}/r1v3/{ID}_bf2mri_dof9.mat"
        brain_mask: "{mri}/{ID}_mri_mask.nii.gz"
      - brains: [MF278, MR249, MR252, MR254, MR256, MR261]
        nonlin: "{mri}/nonlinear_r1v3mr"
        matrix: "{mri}/r1v3mr/{ID}_bf2mri_dof9.mat"
        brain_mask: "{mri}/{ID}_mri_mask_completion_reg_2026-10-03.nii.gz"
        register: "{mri}/{ID}_register_2026-10-03.nii.gz"
      - brains: [MR257]
        nonlin: "{mri}/nonlinear_r1v3m"
        matrix: "{mri}/r1v3m/{ID}_bf2mri_dof9.mat"
        brain_mask: "{mri}/{ID}_mri_mask.nii.gz"
      - brains: [MF191, MF196, MF204, MR244, MR247, MR248, MR263, MR273]   # no MRI: the stand-in b0
        nonlin: "{mri}/nonlinear_s2lin_prod"
        matrix: "{mri}/s2lin_prod/{ID}_bf2mri_dof9.mat"
        brain_mask: "{mri}/{ID}_pseudo_brain_n1_0p5_prod.nii.gz"
        stand_in_b0: "{nonlin}/{ID}_mri_full.nii.gz"

# --- withheld-slab evaluation (Methods: "a slab of photographed tissue as large as the brain's missing tissue was withheld and
#     predicted by a network trained without it") ---
evaluation:
  extrapolation_min_brains: 3    # sigma2.py: depths reached by fewer brains end the measured curve
  extrapolation_edge_mm: 3.0     #   its "edge3" voxels are at least this far inside their column's photographed tissue
  extrapolation_min_vox: 50      #   depth bins with fewer voxels per brain are dropped
  extrapolation_at_mm: [0.5, 1.0, 2.0, 4.0, 8.0]
  extrapolation_table_max_mm: 16.0
  ssim_min_slice_vox: 50         # SSIM per coronal slice over the scored voxels; slices with fewer scored voxels are skipped,
  ssim_min_box: 7                #   and so are slices whose scored bounding box is narrower than the 7 x 7 SSIM window
  sharp_sigma_mm: 0.5            # high-frequency content = image minus its Gaussian blur (sigma 0.5 mm)
  min_sharp_vox: 200
  min_bin_vox: 500               # depth bins (1 mm) with fewer scored voxels are not reported
  n_boot: 10000                  # paired bootstrap over brains
