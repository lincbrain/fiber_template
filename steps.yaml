# The plan run.py runs: every step of the paper, as one entry each (docs/tutorials/ describe them in words).
# Every step reads the paper's inputs from the data folders (links to the records) and writes into the clone; its check compares
# what it wrote with the paper's file. Fields:
#   name      the step's id; with `for`, the step is written out once per brain as <name>-<ID>, and {id} in the other fields is the brain
#             ({chain_tag} and {lgnstn_dir}: the labels' route in the settings, settings/labels.yaml template_chain_tag and
#             products_mri.yaml lgnstn_template_labels)
#   group     setup | paper | mri-template | blockface | registration | synthesis | blockface-template | link | histology | labels | training
#   for       a set of brains (`sets` below) or a list of LINC IDs
#   title, inputs, outputs   what it does, reads and writes, in plain words
#   run       the command: one shell line, from the repository root, in the shell that `source settings/roots.sh` gives
#   check     a command that exits 0 only when `expect` holds and prints its evidence on its last line; left out when there is no
#             file of record to compare with
#   expect    what the check proves
#   needs     steps that must have run to their end first; a per-brain step's base name means the same brain's step
#   gpu_gb, gpu_model, gpu_alone, ram_gb, cores, disk_gb   what it needs: free GPU memory (GB), the card model when the check only
#             holds on it, the card to itself, RAM (GB), cores, the disk it writes (GB)
#   hours, timed   how long it took, and where that time comes from: clone | docs | paper's run | estimated
#   optional  true: runs only when named with --only
#   note      one sentence a tester must know

sets:
  mri_template: [MF283, MF284, MF285, MF286]
  all: [MF278, MF275, MF282, MF191, MF196, MF204, MR243, MR252, MR256, MR249, MR250, MR251, MR253, MR254, MR257, MR261, MR244, MR247, MR248, MR263, MR273]
  with_mri: [MF278, MF275, MF282, MR243, MR252, MR256, MR249, MR250, MR251, MR253, MR254, MR257, MR261]
  without_mri: [MF191, MF196, MF204, MR244, MR247, MR248, MR263, MR273]
  large: [MF278, MF275, MF282, MR252, MR256, MR250, MR251, MR253, MR254, MR257, MR261, MR263, MR273]
  small: [MF191, MF196, MF204, MR243, MR249, MR244, MR247, MR248]
  histology: [MR243, MR252, MR256, MF278, MF275, MF191]
  labels: [MR243, MR252, MR256, MF191]

steps:

  # ---- setup
  - name: data-folders
    group: setup
    title: Data folders of all 21 brains (records linked, manual inputs copied)
    reads: the records ($LINC_RECORDS/data/sub-<ID>, read only); settings/brains/<ID>.yaml
    writes: $LINC_DATA/sub-<ID>/ (links to the records; xfm/ empty, xfm_record/ the entries of record); $LINC_REBUILD_DATA/sub-<ID>/blockface/ (copies
      of the manual inputs only)
    run: code/shared/make_local_data.sh $(dirname $LINC_DATA) MF278 MF275 MF282 MF191 MF196 MF204 MR243 MR252 MR256 MR249 MR250 MR251 MR253 MR254 MR257
      MR261 MR244 MR247 MR248 MR263 MR273 && code/shared/make_local_data.sh $(dirname $LINC_REBUILD_DATA) --rebuild MF278 --rebuild MF275 --rebuild MF282
      --rebuild MF191 --rebuild MF196 --rebuild MF204 --rebuild MR243 --rebuild MR252 --rebuild MR256 --rebuild MR249 --rebuild MR250 --rebuild MR251
      --rebuild MR253 --rebuild MR254 --rebuild MR257 --rebuild MR261 --rebuild MR244 --rebuild MR247 --rebuild MR248 --rebuild MR263 --rebuild MR273
    check: 'n=0; for S in MF278 MF275 MF282 MF191 MF196 MF204 MR243 MR252 MR256 MR249 MR250 MR251 MR253 MR254 MR257 MR261 MR244 MR247 MR248 MR263
      MR273; do E=$LINC_REBUILD_DATA/sub-$S/blockface/curated/$S; [ -e $LINC_DATA/sub-$S/blockface/$S"_blockface.ome.zarr" ] && [ -f $E"_mask_edited.nii.gz"
      ] && [ -f $E"_holes_edited.nii.gz" ] && [ ! -L $E"_mask_edited.nii.gz" ] && n=$((n+1)); done; l=$(find $LINC_REBUILD_DATA/sub-*/blockface -type
      l | wc -l); echo "$n of 21 brains: products of record linked, manual inputs copied; $l links in the rebuild''s blockface folders"; [ $n -eq 21
      ] && [ $l -eq 0 ]'
    expect: all 21 brains in both folders, and no link into the records in the rebuild's blockface folders (so a reconstruction cannot write into
      the records)
    needs: []
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 1
    cores: 1
    disk_gb: 2
    hours: 0.15
    timed: clone
    optional: false
    note: 'Tested: 7 min 6 s, 132,901 links and 15,571 copies (1.0 GB), check 21 of 21. Adds to the folders settings/roots.sh built and overwrites nothing,
      so it is safe to rerun; but not beside another code/shared/make_local_data.sh writing to the same folder (two runs can race on one link): run the other
      data-folder steps after it.'

  # ---- paper
  - name: paper-numbers
    group: paper
    title: Compute every numbers record of the paper (CPU)
    reads: the paper's products (records, read only), the raw MRI and histology links of local_data/raw
    writes: $LINC_NUMBERS/<record>.json (about 70 records), $LINC_WORK (about 10 GB of intermediate files)
    run: LINC_DATA=$LINC_PRODUCTS/data make -C code/figures numbers
    check: $PY tests/check_numbers.py --ref tests/reference --new $LINC_NUMBERS $($PY -c "import os, pathlib; print(' '.join(sorted(p.stem
      for p in pathlib.Path(os.environ['LINC_NUMBERS']).glob('*.json') if p.name != 'provenance.json')))")
    expect: every record written so far matches the paper's reference (documented exceptions on their paper-read fields)
    needs: []
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 32
    cores: 4
    disk_gb: 11
    hours: 2.8
    timed: clone
    optional: false
    note: '6 Nov, clone 7929dc3 on a shared machine at nice 10, these lines verbatim: 2 h 46 min, check 81 of 81 records match (2 h 16 min on 4-5
      Nov); RAM not measured (32 GB is an estimate)'
  - name: paper-numbers-gpu
    group: paper
    title: Compute the two numbers records that run a network on the GPU
    reads: the leave-slab-out network and the prepared brains of record; the development and final stand-in b0s
    writes: $LINC_NUMBERS/d3_domain_shift.json, d3_domain_shift_prod.json
    run: LINC_DATA=$LINC_PRODUCTS/data make -C code/figures numbers-gpu
    check: $PY tests/check_numbers.py --ref tests/reference --new $LINC_NUMBERS d3_domain_shift d3_domain_shift_prod
    expect: both records match the paper's on the fields the comparison reads, to 1e-4 (GPU predictions; identical on an RTX 6000 Ada)
    needs: []
    gpu_gb: 4
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 4
    disk_gb: 0.01
    hours: 0.09
    timed: clone
    optional: false
    note: '6 Nov, clone 7929dc3, an RTX 6000 Ada, beside other test jobs: 319 s, check 2 of 2 records match; within the 1e-4 tolerance on any card'
  - name: paper-numbers-figures
    group: paper
    title: Draw the figures that also write a numbers record
    reads: the paper's products (records, read only); the 3D environment (install.sh --with-figures-3d)
    writes: outputs/figures/ (the figures of the numbers-figures target) and their records in $LINC_NUMBERS
    run: LINC_DATA=$LINC_PRODUCTS/data make -C code/figures numbers-figures
    check: $PY tests/check_numbers.py --ref tests/reference --new $LINC_NUMBERS $(make -s --no-print-directory -C code/figures print-figure-records)
    expect: every figure record that no numbers target writes (make -C code/figures print-figure-records, 3 in this release) matches the paper's
    needs: []
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 4
    disk_gb: 1
    hours: 0.14
    timed: clone
    optional: false
    note: '6 Nov, clone 7929dc3 on a shared machine, beside other test jobs: 497 s, check 7 of 7 records match; needs PY_VIZ3D (install.sh --with-figures-3d)'
  - name: paper-figures
    group: paper
    title: Draw the paper's figures
    reads: the paper's products (records, read only); HISTOLOGY_ARGS (code/figures/Makefile) and LINC_RAW (settings/roots.sh)
    writes: outputs/figures/<target>.{pdf,png} and their provenance
    run: LINC_DATA=$LINC_PRODUCTS/data make -C code/figures -j 2 figures
    check: '$PY -c "import pathlib, sys; T = sys.argv[1:]; m = [t for t in T if not any(pathlib.Path(''outputs/figures'').glob(t + ''.*''))]; print(f''{len(T)
      - len(m)} of {len(T)} figures written'' + (''; missing: '' + '' ''.join(m) if m else '''')); sys.exit(1 if m or not T else 0)" $(make -s --no-print-directory
      -C code/figures print-figures)'
    expect: every target of make figures wrote its file (make -C code/figures print-figures, 16 in this release; none skipped); the drawings are not
      compared bit for bit
    needs: []
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 4
    disk_gb: 0.5
    hours: 0.25
    timed: clone
    optional: false
    note: '6 Nov, clone 7929dc3 on a shared machine, beside other test jobs: 826 s, check 16 of 16 figures written. 4 Nov clean clone: 713 s; 7 of
      14 byte-identical to the paper''s, 3 more under matplotlib 3.10.8, 3 differ only in the PDF date. The 6 Nov figures (Fig. 2 MM6, Figs. S2 and
      S3, the lean withheld-slab figure) are not yet in the release'
  - name: paper-check
    group: paper
    title: Compare every numbers record with the paper's
    reads: $LINC_NUMBERS (all records of the four paper steps)
    writes: the comparison, on screen
    run: LINC_DATA=$LINC_PRODUCTS/data make -C code/figures bf_camera_exif mm_mri_check_r054
    check: $PY tests/check_numbers.py --ref tests/reference --new $LINC_NUMBERS
    expect: every reference record has a regenerated record and they match ("N of N records match"; 81 of 81 at 7929dc3)
    needs: [paper-numbers, paper-numbers-gpu, paper-numbers-figures, paper-figures]
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 4
    cores: 1
    disk_gb: 0.01
    hours: 0.02
    timed: clone
    optional: false
    note: '6 Nov, clone 7929dc3 on a shared machine, these lines verbatim: 11 s, check 81 of 81 records match. The run line regenerates the two records
      that hold the clone''s raw paths; single records need make -C code/figures (the root Makefile forwards only the group targets)'

  # ---- mri-template
  - name: mri-stage
    group: mri-template
    for: mri_template
    title: Stage the brain's preprocessed MRI as the build's inputs (N4, fractions)
    reads: the preprocessed files ($LINC_MRI_PREPROCESSED/{id}); the brain masks (local_mri, built by settings/roots.sh)
    writes: $LINC_MRI_DATA/sub-{id}/mri/{dwi,t2,micro}/ and dwi/raw/ (the tensor's inputs)
    run: LINC_DATA=$LINC_MRI_DATA $PY code/template/build_mri_channels.py --step stage-{id}
    again: --force
    check: $PY tests/compare/compare_mri_build.py staged $LINC_MRI_DATA/sub-{id}/mri $LINC_PRODUCTS/mri/data/sub-{id} --min 17
    expect: every staged image (23 on MF1) identical to the paper's, N4 included
    needs: []
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 8
    cores: 8
    disk_gb: 6
    hours: 0.07
    timed: clone
    optional: false
    note: 'All four brains identical from a clone on 4 Nov; MF1 again on 6 Nov, 231 s, 23 of 23. Steps of the build refuse to write over their own
      writes: run.py adds --force when it runs a step again (the `again` field), and by hand a failed step is rerun with --force added.'
  - name: mri-tensor
    group: mri-template
    for: mri_template
    title: Fit the diffusion tensor on the b <= 4800 volumes
    reads: mri-stage's dwi/raw/ files
    writes: $LINC_WORK/build_mri_channels/tensor_d9/{id}/tensor_d9_dwigrid.nii.gz
    run: LINC_DATA=$LINC_MRI_DATA $PY code/template/build_mri_channels.py --step tensor-{id}
    again: --force
    check: $PY tests/compare/compare_nifti.py $LINC_WORK/build_mri_channels/tensor_d9/{id} $LINC_PRODUCTS/mri/tensor_refit_d9/{id}_existing tensor_d9_dwigrid.nii.gz
    expect: the tensor identical to the paper's, voxel for voxel
    needs: [mri-stage]
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 12
    cores: 8
    disk_gb: 3
    hours: 0.13
    timed: clone
    optional: false
    note: Identical on all four brains from a clone (4 Nov); MF1 again on 6 Nov, 1 of 1 identical, 381 s (481 s in the paper's run).
  - name: mri-nmt
    group: mri-template
    for: mri_template
    title: Register NMT v2 to the b0 and carry its SARM labels (for the AC and PC)
    reads: mri-stage's b0 and mask; NMT v2
    writes: $LINC_MRI_DATA/sub-{id}/mri/landmarks/{nmt_affine_0GenericAffine.mat,SARM6_in_subject.nii.gz}
    run: LINC_DATA=$LINC_MRI_DATA $PY code/template/build_mri_channels.py --step nmt-{id}
    again: --force
    check: $PY tests/compare/compare_mri_build.py nmt $LINC_MRI_DATA/sub-{id}/mri $LINC_PRODUCTS/mri/data/sub-{id} --min-agree 93
    expect: the SARM labels agree with the paper's on at least 93 % of the brain's voxels (93.3 to 94.3 % from a clone)
    needs: [mri-stage]
    gpu_gb: 16
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 4
    disk_gb: 1
    hours: 0.13
    timed: clone
    optional: false
    note: A GPU registration (ANTs, then anatomix + FireANTs); the paper's ran on an earlier version of the engine, so it is never identical. 205
      to 460 s, 11.4 to 15.3 GB of GPU memory. Run from a clone on 4 Nov; on 6 Nov its check was run on those outputs (93.3 to 94.3 %), the card being
      busy.
  - name: mri-t2reg
    group: mri-template
    for: mri_template
    title: Register the T2-weighted image to the b0 (one field)
    reads: mri-stage's b0, T2 and masks
    writes: $LINC_MRI_DATA/sub-{id}/xfm/t2-native__to__b0-native/
    run: LINC_DATA=$LINC_MRI_DATA $PY code/template/build_mri_channels.py --step t2reg-{id} --force
    check: $PY tests/compare/compare_mri_build.py field t2 $LINC_MRI_DATA/sub-{id} $LINC_PRODUCTS/mri/data/sub-{id} --median 0.05 --p99 0.3
    expect: the field within a median of 0.05 mm and a 99th percentile of 0.3 mm of the paper's inside the brain (medians 0.009 to 0.037 mm, 99th
      percentiles 0.18 to 0.25 mm in two reruns)
    needs: [mri-stage]
    gpu_gb: 16
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 4
    disk_gb: 1
    hours: 0.1
    timed: clone
    optional: false
    note: 'GPU registration: not identical between GPU sessions, even on one card model. 205 to 413 s, 13.9 to 15.6 GB of GPU memory. Run from a clone
      on 4 Nov; on 6 Nov its check was run on those outputs. The lab run of 6 Nov: medians 0.017 to 0.037 mm, 99th percentiles 0.18 to 0.25 mm; on
      MF1 one voxel moved 1.01 mm (0.52 mm on 4 Nov), so the largest is reported, not checked.'
  - name: mri-microreg
    group: mri-template
    for: [MF283]
    title: Register the microstructure session's b0 to the b0 (one field)
    reads: mri-stage's b0 images and masks of both sessions
    writes: $LINC_MRI_DATA/sub-{id}/xfm/micro-native__to__b0-native/
    run: LINC_DATA=$LINC_MRI_DATA $PY code/template/build_mri_channels.py --step microreg-{id} --force
    check: $PY tests/compare/compare_mri_build.py field micro $LINC_MRI_DATA/sub-{id} $LINC_PRODUCTS/mri/data/sub-{id} --median 0.05 --p99 0.5
    expect: the field within a median of 0.05 mm and a 99th percentile of 0.5 mm of the paper's inside the brain (MF1 0.024 to 0.033 mm and 0.37 to
      0.42 mm)
    needs: [mri-stage]
    gpu_gb: 23
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 4
    disk_gb: 1
    hours: 0.15
    timed: clone
    optional: false
    note: 'Needs 22.1 GB of GPU memory as nvidia-smi counts it: a 48 GB card, not a 20 GB one. 379 s on MF1 (4 Nov). The lab run of 6 Nov: median
      0.024 mm, 99th percentile 0.37 mm.'
  - name: mri-microreg
    group: mri-template
    for: [MF284, MF285, MF286]
    title: Register the microstructure session's b0 to the b0 (one field)
    reads: mri-stage's b0 images and masks of both sessions
    writes: $LINC_MRI_DATA/sub-{id}/xfm/micro-native__to__b0-native/
    run: LINC_DATA=$LINC_MRI_DATA $PY code/template/build_mri_channels.py --step microreg-{id} --force
    check: $PY tests/compare/compare_mri_build.py field micro $LINC_MRI_DATA/sub-{id} $LINC_PRODUCTS/mri/data/sub-{id} --median 0.05 --p99 0.5
    expect: the field within a median of 0.05 mm and a 99th percentile of 0.5 mm of the paper's inside the brain (MF1 0.024 to 0.033 mm and 0.37 to
      0.42 mm)
    needs: [mri-stage]
    gpu_gb: 23
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 4
    disk_gb: 1
    hours: 0.15
    timed: clone
    optional: false
    note: 'First run from a clone in the lab run of 6 Nov: medians 0.008 to 0.025 mm, 99th percentiles 0.24 to 0.40 mm (largest 1.03 to 1.32 mm, one
      voxel). Needs a 48 GB card.'
  - name: mri-frames
    group: mri-template
    for: mri_template
    title: Find the AC and PC, then the brain's canonical frame
    reads: mri-nmt's labels and affine; mri-stage's b0 and mask
    writes: $LINC_MRI_DATA/sub-{id}/mri/landmarks/{landmarks.json,canonical.json}
    run: LINC_DATA=$LINC_MRI_DATA $PY code/template/build_mri_channels.py --from landmarks-{id} --to frames-{id}
    again: --force
    check: $PY tests/compare/compare_mri_build.py frame $LINC_MRI_DATA/sub-{id}/mri $LINC_PRODUCTS/mri/data/sub-{id} --deg 1.0 --mm 0.5
    expect: the frame within 1 degree and a mean move of 0.5 mm of the paper's (0.04 to 0.81 degrees, 0.09 to 0.31 mm from a clone)
    needs: [mri-nmt]
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 4
    cores: 2
    disk_gb: 0
    hours: 0.03
    timed: clone
    optional: false
    note: 'From the clone''s own NMT registration the plane fit can land on another optimum: on MF4 (MF286) 0.81 degrees from the paper''s plane,
      close to the 1 degree limit.'
  - name: mri-prepare
    group: mri-template
    for: mri_template
    title: Resample every channel onto the canonical grid, cut to the mask, mirror
    reads: mri-frames' frame; mri-tensor's tensor; mri-t2reg's and mri-microreg's fields; the staged images; the final mask
    writes: $LINC_WORK/build_mri_channels/prep/{id}/ (the construction inputs and their _flip mirrors)
    run: LINC_DATA=$LINC_MRI_DATA $PY code/template/build_mri_channels.py --step prepare-{id}
    again: --force
    check: $PY tests/compare/compare_mri_build.py prepare $LINC_WORK/build_mri_channels/prep/{id} $LINC_PRODUCTS/mri/data/sub-{id}/canonical_rebuild_manual_annotations_frac
    expect: inside both masks, r with the paper's of at least 0.88 (T2), 0.87 (b0), 0.84 (fractions), 0.98 (tensor), mask Dice at least 0.97
    needs: [mri-frames, mri-tensor, mri-t2reg, mri-microreg]
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 4
    disk_gb: 1
    hours: 0.05
    timed: clone
    optional: false
    note: 'Never identical: every image goes through the rerun''s frame. From a clone (4 Nov, MF2 to MF4 with the paper''s microreg): MF4 (MF286)
      T2 r 0.885, b0 0.879, fractions 0.871 and 0.845, tensor 0.981, Dice 0.979, near the limits; with its own microreg it was never run.'
  - name: mri-assemble
    group: mri-template
    title: Write the MMORF run folder from the construction inputs
    reads: the paper's construction inputs ($LINC_PRODUCTS/mri/data/sub-<ID>/canonical_rebuild_manual_annotations_frac), or mri-prepare's ($LINC_WORK/build_mri_channels/prep/<ID>)
      when the data folder does not hold the paper's; settings/mri_construction.yaml
    writes: $LINC_WORK/mri_construction/runs/rb_final/ (config/, subject_ids.csv, standardspace.nii.gz, data/ links, run_spec.json)
    run: $PY code/template/construction_inputs.py --work $LINC_WORK/mri_construction --paper "$LINC_PRODUCTS/mri/data/sub-<ID>/canonical_rebuild_manual_annotations_frac"
      --own "$LINC_WORK/build_mri_channels/prep/<ID>" MF283 MF284 MF285 MF286 && $PY code/template/build_mri_channels.py --work $LINC_WORK/mri_construction
      --step assemble --force
    check: $PY tests/compare/compare_mri_build.py run $LINC_WORK/mri_construction/runs/rb_final $LINC_PRODUCTS/mri/tc/rb_final --parts config subject_ids.csv
      standardspace.nii.gz --min 16
    expect: the 14 parameter files, the subject list and the standard space identical to the paper's run (16 of 16)
    needs: []
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 2
    cores: 1
    disk_gb: 0.1
    hours: 0.01
    timed: clone
    optional: false
    note: 'The construction starts from the paper''s inputs, not from mri-prepare''s, so that its comparison can be exact. When the data folder does
      not hold them it starts from mri-prepare''s and says so; the comparison then has nothing to compare with, or differs. A prep/<ID> link
      that already leads to construction inputs is left alone. On 6 Nov from a clone: 11 s, 16 of 16.'
  - name: mri-construction-step1
    group: mri-template
    title: Run the groupwise construction through its affine stage and step 1
    reads: mri-assemble's run folder; MMORF 1.0.1 ($LINC_MMORF_EXE); the patched driver ($LINC_TEMPLATE_DRIVER)
    writes: $LINC_WORK/mri_construction/runs/rb_final/out/{affine_step1,affine_step2,nln_step_01}/
    run: $PY code/shared/run_until.py $LINC_WORK/mri_construction/runs/rb_final/out/scripts/021_nlnT_mmorf.sh -- $PY code/template/build_mri_channels.py
      --work $LINC_WORK/mri_construction --step mmorf
    check: W=$LINC_WORK/mri_construction/runs/rb_final/out && N=$(find $W/affine_step1 $W/affine_step2 $W/nln_step_01 -type f ! -name "*.ini" | wc -l) && [ "$N" -ge 202 ]
      && echo "$N files written in affine_step1, affine_step2 and nln_step_01 (at least 202 expected)"
    expect: the affine stage and step 1 wrote at least the 202 files the paper kept; this check counts them and does not compare them (see the note)
    needs: [mri-assemble]
    gpu_gb: 6
    gpu_model: RTX 6000 Ada
    gpu_alone: true
    ram_gb: 32
    cores: 8
    disk_gb: 30
    hours: 2
    timed: clone
    optional: false
    note: 'This check counts the files and does not compare them, because the paper''s files of this stage are not in the data tree. The full comparison with those files passed in the 189-step run from a clone (6 Nov: 202 of 202 identical). Stops the driver when step 2''s first task is written. 4 Nov from a clone on a shared RTX 6000 Ada: 202 of 202 identical, 3.9 GB of GPU
      memory at most, 2.9 h with one stop and resume (the paper''s run: 7 min + 1.2 h). The plan asks for the card alone; the 4 Nov run shared the
      card and was still identical. run_until.py is new (tested on 6 Nov on a small command); the 4 Nov run was stopped the same way by a script.'
  - name: mri-construction-full
    group: mri-template
    title: Run the whole groupwise construction (8 steps), 3.5 days on one card
    reads: the paper's construction inputs, or mri-prepare's when the data folder does not hold the paper's (as mri-assemble); MMORF 1.0.1; the patched driver
    writes: '$LINC_WORK/mri_construction_full/runs/rb_final/out/ (nln_step_08/iteration_03: the warps the channels read)'
    run: $PY code/template/construction_inputs.py --work $LINC_WORK/mri_construction_full --paper "$LINC_PRODUCTS/mri/data/sub-<ID>/canonical_rebuild_manual_annotations_frac"
