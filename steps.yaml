    check: $PY tests/compare/compare_nifti.py $LINC_WORK/labels/{id}/structures_mri $LINC_PRODUCTS/labels/push_current_h9/{id} $(ls $LINC_PRODUCTS/labels/push_current_h9/{id}
      | grep -E '^{id}_(.*_(mri-template|b0-native)_(prob|mask)(_demons)?|labels_demons_prov_(mri-template|b0-native))\.nii\.gz$')
    expect: every carried probability map, mask and provenance identical to the paper's MRI-route files (34 of 34)
    needs: []
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 4
    cores: 2
    disk_gb: 0.1
    hours: 0.06
    timed: clone
    optional: false
    note: 'The MRI-route comparison, checked against labels/push_current_h9. On 15 Nov: 126 of 126 on both routes (42 per brain with the
      3D labels), 1 to 3 minutes per brain.'
  - name: labels-sections
    group: labels
    title: Carry each charted section into the template, without interpolation
    reads: the paper's pushed and group labels; the registrations of record (read through LINC_DATA=$LINC_PRODUCTS/data)
    writes: $LINC_WORK/tracer_sections_v2/<ID>/ and $LINC_WORK/labels/numbers/tracer_sections_v2{,_mf191}.json
    run: mkdir -p $LINC_WORK/labels/numbers && LINC_DATA=$LINC_PRODUCTS/data LINC_NUMBERS=$LINC_WORK/labels/numbers $PY code/figures/paper_numbers/tracer_sections_v2.py
    check: $PY tests/check_numbers.py --ref tests/reference --new $LINC_WORK/labels/numbers tracer_sections_v2 tracer_sections_v2_mf191
    expect: both records equal to the paper's (tests/reference)
    needs: []
    gpu_gb: 0
    gpu_model: ''
    gpu_alone: false
    ram_gb: 16
    cores: 16
    disk_gb: 1
    hours: 0.5
    timed: clone
    optional: false
    note: 'On 6 Nov from a clone: 2 of 2 records match; about 15 to 30 minutes of running on 16 cores (the wall time, 2.2 h, includes a pause). Writes
      its own numbers folder, so it can run beside make numbers, which writes the same records into $LINC_NUMBERS.'

  # ---- training
  - name: training-segment-mri-brainmask
    group: training
    title: Train the MRI brain-mask segmentation model again (all brains)
    reads: settings/segment/mri_brainmask.json and the manually corrected MRI masks it lists (records)
    writes: $LINC_WORK/segment/runs/mri_brainmask/fold_all/model.pt, spec.json, record.json
    run: $PY_DEEP code/shared/linc-segment train --task settings/segment/mri_brainmask.json --fold all
    check: cmp $LINC_WORK/segment/runs/mri_brainmask/fold_all/model.pt $LINC_MODELS/segment/mri_brainmask/model.pt && echo "model.pt byte-identical
      to the released mri_brainmask model"
    expect: the trained model.pt byte-identical to the released one
    needs: []
    gpu_gb: 10
    gpu_model: RTX 6000 Ada
    gpu_alone: false
    ram_gb: 32
    cores: 8
    disk_gb: 5
    hours: 2
    timed: docs
    optional: true
    note: byte-identical once (4 Nov, an RTX 6000 Ada); other card models and the other three segmentation models were not retrained
  - name: training-synthesis
    group: training
    title: Train the synthesis network again (the 13 brains with MRI)
    reads: the 13 prepared folders of record ($LINC_COMPLETION_PREPARED)
    writes: $LINC_WORK/completion/d3_full_retrain/last.pt, train_log.jsonl
    run: $PY_DEEP code/blockface/synthesis/linc-complete train --root $LINC_COMPLETION_PREPARED --out $LINC_WORK/completion/d3_full_retrain
    check: test -s $LINC_WORK/completion/d3_full_retrain/last.pt && tail -n 1 $LINC_WORK/completion/d3_full_retrain/train_log.jsonl
    expect: trained to the recipe's last epoch (its last log line shown); not compared bit for bit, since the recipe does not give the same bits
    needs: []
    gpu_gb: 8
    gpu_model: ''
    gpu_alone: false
    ram_gb: 32
    cores: 8
    disk_gb: 1
    hours: 1
    timed: docs
    optional: true
    note: 'retrained once (an RTX 6000 Ada): last-10-epoch loss within 0.06 %, MF5''s synthesized tissue r = 0.95 against the released network (tests/README.md)'
