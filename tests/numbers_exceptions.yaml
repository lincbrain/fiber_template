# Records that cannot regenerate identically because their inputs changed after they were written, for reasons the paper
# reports elsewhere. check_numbers.py compares them only on the fields the paper reads. Each entry needs the owner's reason.
# Two more kinds of entry, listed by check_numbers.py instead of failing it: no_reference (a by-product with no reference record) and
# not_regenerated (a reference this release does not regenerate).
bf_cohort:
  reason: "written 28 Sep 2026; the 2 Oct spacing calibration (18 brains: vx_um, vz_um, L1_inplane_um, isotropic_cap_mm, brain_volume_ml) and the later MM8/MM9 MRI-mask edits (mri_brain_volume_ml) changed its inputs; the regenerated record is the current state"
  # the paper reads: bf_cohort.rows|len, bf_cohort.rows.mri_tier!=.*.subject|len, bf_cohort.rows.subject=<ID>.0.mri_voxel_mm (13 brains)
  compare: ["rows|len", "rows.*.subject", "rows.*.mri_tier", "rows.*.mri_voxel_mm"]
fig_routes_1c_section:
  reason: "the record names the figure file it was written with (its `figure` field: the analysis project's output path); every other field is regenerated"
  # the paper reads: fig_routes_1c_section.section_nmt_y_mm
  compare: ["example_pair", "brains", "section_index_ijk", "section_nmt_y_mm", "crop_height_pct", "fov_mm"]
bf_sanity:
  reason: "written 27 Sep 2026, before the 2 Oct spacing calibration rescaled 18 brains' headers (their extents, slice steps and centroid steps); the regenerated record is the current state"
  # the paper reads: bf_sanity.n ("All 21 photographed stacks were reconstructed")
  compare: ["n", "rows|len", "rows.*.subject"]

d3_domain_shift:
  reason: "GPU predictions: the code of record (isbi2027 domain_shift_v3.py), rerun on the same card model (RTX 6000 Ada) and env (env/completion.yml), gives the port's values exactly; both differ from the 4 Oct record by at most 6e-4 (one PSNR, dB) and by 6e-6 in summary.ssim.mean_own (0.683718 vs 0.683712), which the paper prints to 2 decimals (0.68 in both); the record's own run is not reproducible bitwise"
  # the paper reads: d3_domain_shift.summary.ssim.mean_own (|.2f), d3_domain_shift.summary.ssim.n
  compare: ["summary.ssim.n", "summary.ssim.mean_own", "per_brain|len"]
  tol: 1.0e-4
d3_domain_shift_prod:
  reason: "GPU predictions: regenerated on the record's GPU model (RTX 6000 Ada, settings/env/deep.yml) it equals the record to 1e-9 (6 Nov 2026); other GPU models can change the last digits. The paper prints none of its values: d3p_vs_d3_pseudo_prod reads the record of record (numbers_of_record), so it is compared on the fields that record reads"
  # read by d3p_vs_d3_pseudo.py --final: per_brain.<ID>.{own,pseudo}.{ssim,l1}, per_brain.<ID>.score_vox
  compare: ["summary.ssim.n", "per_brain|len", "per_brain.*.own.ssim", "per_brain.*.pseudo.ssim", "per_brain.*.own.l1",
            "per_brain.*.pseudo.l1", "per_brain.*.score_vox"]
  tol: 1.0e-4

r057_s1_synthesis:
  reason: "a record of copies: its isbi block is copied unchanged from the number records of the synthesis network's own paper (products isbi_numbers, dated snapshots; this release does not recompute that paper's evaluations), its precision block from two records of record (numbers_of_record); every value is compared, and every source's md5 except the brain-name file's: the release reads the names from settings/specimen_labels.json (the same mapping as the record's paper/numbers/specimen_labels.json, another file), and the sources' paths name the machine that ran it"
  # the paper reads: r057_s1_synthesis.isbi.*, .precision.*, .inference.* (Supplementary S1.2-S1.4)
  compare: ["what", "isbi", "precision", "inference", "evaluated", "sources.table1_v3.md5", "sources.extra_v3.md5", "sources.results_v3.md5",
            "sources.data_v3.md5", "sources.compute_v3.md5", "sources.brain_labels_v4.md5", "sources.precision_weights_b1_d2b_s8.md5",
            "sources.d3_A_sigma2_pred_flat.md5", "sources.tau2_json.md5"]
  # sources.completion_yaml.md5 is not compared: that file's text changes with comments and moved parameters; the values it supplies are compared (inference, precision)

fig_tracer_r058_h9:
  reason: "written by the tracer figure's script (code/figures/tracer.py): its free-text method field is that script's docstring and its outputs field the figure files it wrote, which name the analysis project's variant script and paths; every value is regenerated"
  # the paper reads: fig_tracer_r058_h9.mf8_unbridged_outlined.share_unbridged
  compare: ["cases", "voxel_mm3", "rules", "groups", "slab", "colors", "mirrored_for_display", "alic_counts_slab_solid", "injection_sites_b",
            "mf8_unbridged_outlined"]
  not_regenerated: true
  # history since 15 Nov 2026: the paper reads fig_tracer_r058_h9_s11
fig_tracer_sections3d_v6_h9:
  not_regenerated: true
  reason: "history since 12 Nov 2026: Fig. 9 draws the author's option C (record fig_tracer_sections3d_v6_h9_c); this record, MM1, MF8, MM2 in one view, is regenerated only with settings/figures.yaml tracer_sections3d.cases [MR243, MF191, MR252], and is then compared on the 18 fields that did not change with the view of 12 Nov (view, layout_mm, label anchors and still pixel counts did)"
  # the paper reads: fig_tracer_sections3d_v6_h9.alic_slab_mm, .alic_y_mm.{0,1,2}, .capsule_totals.<ID>.charted_voxels(_in_capsule),
  # .footprint_min_carried_fraction, .planes.coronal_y_mm
  compare: ["alic_slab_mm", "alic_y_mm", "capsule", "capsule_box_mm", "capsule_rule", "capsule_totals", "cases", "drawing",
            "footprint_min_carried_fraction", "injection_point_factor", "mirror", "mirrored", "planes", "point_px_at_window", "projection",
            "protocol", "video", "window_px"]
fig_tracer_sections3d_v6_h9_c:
  reason: "the figure's layout changed after the record (12 Nov 2026, evening: (a)'s 10 mm bar on its title line and the orientation
    letters' room, figstyle.orient_letters); layout_mm (print mm of the panels) is not compared, every other field is"
  # the paper reads: fig_tracer_sections3d_v6_h9_c.alic_slab_mm, .alic_y_mm.{0,1,2}, .capsule_totals.<ID>.charted_voxels(_in_capsule),
  # .footprint_min_carried_fraction, .planes.coronal_y_mm (as the record above)
  compare: ["alic_slab_mm", "alic_y_mm", "arrange", "capsule", "capsule_box_mm", "capsule_rule", "capsule_totals", "cases", "drawing",
            "footprint_min_carried_fraction", "injection_label_anchor_px", "injection_point_factor", "mirror", "mirrored", "planes",
            "point_px_at_window", "projection", "protocol", "still_visibility_pixels", "video", "view", "views", "window_px"]
  not_regenerated: true
  # history since 15 Nov 2026: the paper reads fig_tracer_sections3d_v6_h9_s11_c

